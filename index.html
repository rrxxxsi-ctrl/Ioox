<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKAI | كانفا برو</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}

body{
    background:#0b1f15;
    color:#fff;
    padding-top:70px;
}

/* الشريط العلوي */
.top-bar{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:60px;
    background:#06140d;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    box-shadow:0 4px 15px rgba(0,0,0,.7);
}
.top-logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:4px;
    color:#2ecc71;
    text-shadow:0 0 15px #2ecc71;
}

/* المحتوى */
.container{
    max-width:380px;
    margin:auto;
    padding:20px;
}
.card{
    background:#102c1f;
    border-radius:15px;
    padding:20px;
}
h1{
    color:#2ecc71;
    text-align:center;
    margin-bottom:10px;
}
p{text-align:center;margin-bottom:20px}

ul{list-style:none}
li{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.1)
}

.price{
    text-align:center;
    font-size:36px;
    color:#f1c40f;
    margin:20px 0;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2ecc71;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* نافذة الإيميل */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:10000;
    display:flex;
    justify-content:center;
    align-items:center;
}
.modal-box{
    background:#0f3b24;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:320px;
    text-align:center;
}
.modal-box h3{
    color:#2ecc71;
    margin-bottom:15px;
}
.modal-box input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #2ecc71;
    margin-bottom:15px;
}
.modal-box button{
    background:#27ae60;
    color:#fff;
}
</style>
</head>

<body>

<!-- الشعار -->
<div class="top-bar">
    <div class="top-logo">NIKAI</div>
</div>

<div class="container">
    <div class="card">
        <h1>كانفا برو مدى الحياة</h1>
        <p>تفعيل رسمي على إيميلك</p>

        <ul>
            <li>✔ أدوات Pro كاملة</li>
            <li>✔ بدون علامة مائية</li>
            <li>✔ تحديثات مدى الحياة</li>
        </ul>

        <div class="price">39 ريال</div>

        <button id="orderBtn">اطلب الآن</button>
    </div>
</div>

<!-- نافذة الإيميل -->
<div class="modal" id="emailModal">
    <div class="modal-box">
        <h3>أدخل بريدك الإلكتروني</h3>
        <input type="email" id="emailInput" placeholder="example@email.com">
        <button id="confirmBtn">تأكيد</button>
    </div>
</div>

<script>
const orderBtn = document.getElementById("orderBtn");
const modal = document.getElementById("emailModal");
const confirmBtn = document.getElementById("confirmBtn");

orderBtn.onclick = () => {
    modal.style.display = "flex";
};

confirmBtn.onclick = () => {
    const email = document.getElementById("emailInput").value.trim();
    if(!email || !email.includes("@")){
        alert("أدخل بريد إلكتروني صحيح");
        return;
    }
    alert("تم استلام الإيميل:\n" + email);
    modal.style.display = "none";
};
</script>

</body>
</html>
