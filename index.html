<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | فخامة الاختيار الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* الثيمات اللونية الديناميكية */
        body.theme-osn { --accent-color: #ff007f; --glow-color: rgba(255, 0, 127, 0.2); } /* لون OSN الوردي الجديد */
        body.theme-linkedin { --accent-color: #0077b5; --glow-color: rgba(0, 119, 181, 0.25); }
        body.theme-adobe { --accent-color: #ff0054; --glow-color: rgba(255, 0, 84, 0.2); }
        body.theme-office { --accent-color: #eb3c00; --glow-color: rgba(235, 60, 0, 0.2); }
        body.theme-youtube { --accent-color: #ff0000; --glow-color: rgba(255, 0, 0, 0.2); }
        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.2); }
        body.theme-shahid { --accent-color: #00d982; --glow-color: rgba(0, 217, 130, 0.2); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-base); color: #fff; overflow-x: hidden; transition: var(--transition); }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--glow-color) 0%, transparent 70%);
            z-index: -1; transition: var(--transition);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; text-align: center; }
        header { padding: 40px 0; }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: 6px; color: var(--accent-color); transition: var(--transition); }

        /* شبكة المنتجات */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin-bottom: 40px; }
        .card {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 20px 5px; cursor: pointer; transition: var(--transition);
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.1); box-shadow: 0 10px 25px var(--glow-color); }
        .card i { font-size: 24px; margin-bottom: 8px; color: var(--accent-color); }
        .card h3 { font-size: 10px; font-weight: 700; }

        /* لوحة التفاصيل */
        #checkout {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 30px; margin-bottom: 50px; display: none; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .badge-shared { display: inline-block; background: var(--accent-color); color: #fff; padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; margin-bottom: 15px; }

        /* الباقات */
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 20px 0; }
        .plan-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 15px;
            border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .plan-btn.selected { background: var(--accent-color); color: #fff; font-weight: 700; border-color: var(--accent-color); }
        .plan-btn div { font-size: 10px; opacity: 0.8; margin-bottom: 4px; }
        .plan-btn strong { font-size: 16px; display: block; }

        /* الأقسام الإرشادية */
        .info-panel { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px; text-align: right; margin: 20px 0; font-size: 13px; }
        .info-panel strong { color: var(--accent-color); font-size: 15px; display: block; margin-bottom: 12px; }
        .info-panel ul { padding-right: 18px; color: #ccc; line-height: 1.7; }

        /* وزنية البنك المصلحة */
        .bank-section {
            background: #000; border: 1px solid var(--glass-border); border-radius: 25px;
            padding: 25px; max-width: 480px; margin: 30px auto 0;
            display: flex; flex-direction: column; align-items: center;
        }
        .bank-row { display: flex; justify-content: space-between; width: 100%; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .iban-container {
            width: 100%; background: rgba(255,255,255,0.02); border: 1px dashed var(--accent-color);
            padding: 15px 5px; border-radius: 12px; margin: 15px 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            overflow: hidden; 
        }
        .iban-text { font-family: 'Courier New', monospace; font-size: clamp(10px, 3.8vw, 15px); color: var(--accent-color); white-space: nowrap; }

        .btn-order { width: 100%; background: var(--accent-color); color: #fff; border: none; padding: 18px; border-radius: 12px; font-weight: 700; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #fff; padding: 10px 25px; border-radius: 50px; display: none; z-index: 2000; font-weight: 700; }
        
        @media (max-width: 500px) { .grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }
    </style>
</head>
<body class="theme-default">

    <div class="ambient-bg"></div>
    <div class="toast" id="toast">تم نسخ الحساب البنكي ✅</div>

    <div class="container">
        <header>
            <div class="logo">NIKAI</div>
            <p style="opacity: 0.5;">فخامة الاشتراكات الرقمية 2026</p>
        </header>

        <div class="grid">
            <div class="card" onclick="openService('osn')">
                <i class="fas fa-plus-circle"></i>
                <h3>OSN+</h3>
            </div>
            <div class="card" onclick="openService('linkedin')">
                <i class="fab fa-linkedin"></i>
                <h3>لينكد إن</h3>
            </div>
            <div class="card" onclick="openService('adobe')">
                <i class="fas fa-palette"></i>
                <h3>أدوبي</h3>
            </div>
            <div class="card" onclick="openService('office')">
                <i class="fas fa-file-word"></i>
                <h3>أوفيس</h3>
            </div>
            <div class="card" onclick="openService('youtube')">
                <i class="fab fa-youtube"></i>
                <h3>يوتيوب</h3>
            </div>
            <div class="card" onclick="openService('netflix')">
                <i class="fas fa-film"></i>
                <h3>نتفليكس</h3>
            </div>
            <div class="card" onclick="openService('shahid')">
                <i class="fas fa-play-circle"></i>
                <h3>شاهد VIP</h3>
            </div>
            <div class="card" onclick="openService('chatgpt')">
                <i class="fas fa-robot"></i>
                <h3>ChatGPT</h3>
            </div>
            <div class="card" onclick="openService('crunchy')">
                <i class="fas fa-tv"></i>
                <h3>كرانشي</h3>
            </div>
        </div>

        <section id="checkout">
            <div class="service-head">
                <h2 id="s-title" style="font-size: 26px; font-weight: 900; margin-bottom: 5px;">الخدمة</h2>
                <div id="shared-badge" class="badge-shared">حساب مشترك - ملف خاص</div>
            </div>

            <div class="plans-grid" id="s-plans"></div>

            <div class="info-panel">
                <strong><i class="fas fa-check-circle"></i> مميزات باقة OSN+ بريميوم:</strong>
                <ul id="s-info"></ul>
            </div>

            <div id="email-field" style="display:none; text-align: right; margin: 20px 0;">
                <label style="font-size: 13px; opacity: 0.7; display: block; margin-bottom: 8px;">البريد الإلكتروني (لاستلام التفعيل):</label>
                <input type="email" id="u-email" style="width:100%; padding:15px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); color:#fff;" placeholder="example@mail.com">
            </div>

            <div class="bank-section">
                <div style="width:100%; margin-bottom:15px; font-size:14px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>البنك:</span><strong>بنك البلاد</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>المستفيد:</span><strong>سليمان فلاته</strong></div>
                </div>
                <div class="iban-container" onclick="copyIBAN()">
                    <span class="iban-text">SA0315000900133520020007</span>
                    <i class="fas fa-copy" style="font-size: 11px; opacity: 0.5;"></i>
                </div>
                <button class="btn-order" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> تأكيد وإرسال الإيصال
                </button>
            </div>
        </section>
    </div>

    <script>
        const services = {
            osn: {
                name: "OSN+ بريميوم",
                badge: "ضمان ذهبي 100%",
                plans: [
                    {l: "شهر واحد", p: "15.99 ريال"},
                    {l: "3 أشهر", p: "33.99 ريال"},
                    {l: "6 أشهر", p: "60.99 ريال"},
                    {l: "12 شهر (مشترك)", p: "110 ريال"},
                    {l: "12 شهر (خاص)", p: "239.99 ريال"}
                ],
                info: [
                    "مشاهدة الأفلام والمسلسلات بجودة 4K وبدون إعلانات",
                    "ترجمة احترافية ومتعددة اللغات (عربي/إنجليزي)",
                    "إمكانية التحميل والمشاهدة دون اتصال بالإنترنت",
                    "متاح على الجوال، التابلت، الكمبيوتر، والشاشات الذكية",
                    "وصول كامل لأحدث الإصدارات الحصرية فور توفرها",
                    "دعم فني متوفر 24/7 لحل أي مشكلة"
                ],
                email: false
            },
            linkedin: {
                name: "لينكد إن بريميوم (Business)",
                badge: "تفعيل رسمي برابط مباشر",
                plans: [{l: "شهر", p: "80 ريال"}, {l: "سنة", p: "600 ريال"}],
                info: ["رسائل InMail", "LinkedIn Learning", "علامة ذهبية"],
                email: true
            },
            adobe: { name: "أدوبي كرييتف كلاود", badge: "تفعيل رسمي 100%", plans: [{l: "شهر", p: "99 ريال"}], info: ["فوتوشوب وإلستريتور وأكثر"], email: true },
            office: { name: "أوفيس 365", badge: "ضمان سنة كاملة", plans: [{l: "مدى الحياة", p: "45 ريال"}], info: ["نسخة أصلية 100%"], email: false },
            youtube: { name: "يوتيوب بريميوم", badge: "تفعيل رسمي ومضمون", plans: [{l:"سنة", p:"200 ريال"}], info: ["بدون إعلانات"], email: true },
            netflix: { name: "نتفليكس بريميوم 4K", plans: [{l:"شهر", p:"20 ريال"}], info: ["جودة 4K UHD"], email: false },
            shahid: { name: "شاهد VIP الرياضية", plans: [{l:"شهر", p:"20 ريال"}], info: ["بث المباريات جودة 4K"], email: false },
            chatgpt: { name: "ChatGPT Plus", plans: [{l:"شهر", p:"10 ريال"}], info: ["نموذج GPT-5 وسرعة فائقة"], email: false },
            crunchy: { name: "كرانشي رول", plans: [{l:"سنة", p:"50 ريال"}], info: ["بدون إعلانات جودة 4K"], email: false }
        };

        let currentPrice = "";
        let currentLabel = "";

        function openService(id) {
            document.body.className = 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const s = services[id];
            document.getElementById('checkout').style.display = 'block';
            document.getElementById('s-title').innerText = s.name;
            document.getElementById('shared-badge').innerText = s.badge;
            
            // الباقات
            document.getElementById('s-plans').innerHTML = s.plans.map(p => `
                <div class="plan-btn" onclick="selectPlan(this, '${p.p}', '${p.l}')">
                    <div>${p.l}</div>
                    <strong>${p.p}</strong>
                </div>
            `).join('');

            // المميزات
            document.getElementById('s-info').innerHTML = s.info.map(i => `<li>${i}</li>`).join('');
            
            // الحقول
            document.getElementById('email-field').style.display = s.email ? 'block' : 'none';

            const first = document.querySelector('.plan-btn');
            if(first) first.click();
            window.scrollTo({ top: document.getElementById('checkout').offsetTop - 20, behavior: 'smooth' });
        }

        function selectPlan(el, price, label) {
            document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            currentPrice = price;
            currentLabel = label;
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function placeOrder() {
            const activeId = document.body.className.replace('theme-', '');
            const s = services[activeId];
            const email = document.getElementById('u-email').value;

            if(s.email && !email) { alert("يرجى كتابة البريد الإلكتروني لاستلام التفعيل"); return; }

            let msg = `مرحباً متجر نيكاي 👋\nأرغب في اشتراك: ${s.name}\nالباقة: ${currentLabel}\nالسعر: ${currentPrice}`;
            if(email) msg += `\nالبريد للتفعيل: ${email}`;
            msg += `\n\nتم التحويل البنكي لـ (سليمان فلاته)، مرفق الإيصال:`;

            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
