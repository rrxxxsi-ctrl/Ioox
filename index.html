<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP EXPERIENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color: #ff0000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الخلفية السائلة المتحركة */
        .liquid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #330000 0%, #000 50%);
            z-index: 1;
        }

        /* الكتلة المركزية */
        .main-unit {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .huge-text {
            font-size: clamp(5rem, 20vw, 15rem);
            line-height: 0.8;
            margin: 0;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: -5px;
        }

        .price-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3rem, 10vw, 8rem);
            color: #fff;
            text-shadow: 0 0 50px var(--color);
            pointer-events: auto;
        }

        /* زر الأكشن المختصر جداً */
        .action-circle {
            position: fixed;
            bottom: 50px;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: 0.5s;
            z-index: 20;
            backdrop-filter: blur(10px);
            cursor: pointer;
            pointer-events: auto;
        }

        .action-circle:hover {
            background: var(--color);
            border-color: var(--color);
            transform: scale(1.1);
            box-shadow: 0 0 80px var(--color);
        }

        .tagline {
            position: fixed;
            top: 40px;
            letter-spacing: 10px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
            width: 100%;
        }

    </style>
</head>
<body>

    <div class="liquid-bg" id="bg"></div>

    <div class="tagline">PREMIUM CINEMA ACCESS • 365 DAYS GUARANTEE</div>

    <div class="main-unit">
        <h1 class="huge-text">VIP</h1>
        <div class="price-overlay">200<span style="font-size: 1rem;"> SAR</span></div>
    </div>

    <a href="https://wa.me/966591388202" class="action-circle">
        اشترك الآن
    </a>

    <script>
        // برمجة تتبع الإضاءة السائلة
        const bg = document.getElementById('bg');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            bg.style.setProperty('--x', x + '%');
            bg.style.setProperty('--y', y + '%');
        });

        // دعم الجوال (لمس)
        document.addEventListener('touchmove', (e) => {
            const x = (e.touches[0].clientX / window.innerWidth) * 100;
            const y = (e.touches[0].clientY / window.innerHeight) * 100;
            bg.style.setProperty('--x', x + '%');
            bg.style.setProperty('--y', y + '%');
        });
    </script>
</body>
</html>
