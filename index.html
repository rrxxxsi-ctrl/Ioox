            ],
            icon: "fas fa-palette"
        },
        fasel: {
            ar: {
                h: "فاصل بلس (Fasel Plus)",
                m: [
                    "📺 بدون إعلانات نهائياً",
                    "✅ جودة بث عالية تصل إلى 4K",
                    "🎥 مكتبة أفلام ومسلسلات ضخمة",
                    "📱 تطبيق على جميع المنصات",
                    "⚡ سرعة تحميل عالية"
                ],
                s: [
                    "📌 جهاز واحد فقط لكل اشتراك",
                    "⚠️ يمنع مشاركة الحساب مع آخرين",
                    "📌 يفضل استخدام داخل المملكة",
                    "🔔 تجديد تلقائي مع إشعار مسبق"
                ]
            },
            en: {
                h: "Fasel Plus Premium",
                m: [
                    "📺 No ads forever",
                    "✅ High streaming quality up to 4K",
                    "🎥 Huge library of movies and series",
                    "📱 App available on all platforms",
                    "⚡ High download speed"
                ],
                s: [
                    "📌 One device per subscription",
                    "⚠️ No account sharing with others",
                    "📌 Preferably use within Saudi Arabia",
                    "🔔 Auto-renewal with prior notification"
                ]
            },
            p: [
                {v: 15, n: {ar: "شهر واحد", en: "1 Month"}},
                {v: 59, n: {ar: "6 أشهر", en: "6 Months"}},
                {v: 98, n: {ar: "سنة كاملة", en: "1 Year"}}
            ],
            icon: "fas fa-play-circle"
        }
    };

    // وظيفة إنشاء شريط التنقل
    function renderNav() {
        const nav = document.getElementById('navBar');
        const names = {
            netflix: {ar: 'نتفلكس', en: 'Netflix'},
            disney: {ar: 'ديزني+', en: 'Disney+'},
            canva: {ar: 'كانفا برو', en: 'Canva Pro'},
            fasel: {ar: 'فاصل بلس', en: 'Fasel+'}
        };
        
        nav.innerHTML = Object.keys(products).map(key => `
            <button class="nav-btn ${activeID === key ? 'active' : ''}" onclick="loadP('${key}', this)">
                <i class="${products[key].icon}"></i>
                ${names[key][currentLang]}
            </button>
        `).join('');
    }

    // وظيفة تحميل المنتج
    function loadP(id, btn) {
        activeID = id;
        const d = products[id][currentLang];
        const p = products[id].p;
        
        // تحديث شريط التقدم
        document.getElementById('progressFill').style.width = '100%';
        
        // تحديث معلومات المنتج
        document.getElementById('brandName').innerText = lang[currentLang].brand;
        document.getElementById('titleDisplay').innerText = d.h;
        
        // تحديث المزايا والشروط
        document.getElementById('mList').innerHTML = `<ul>${d.m.map(i => `<li><i class="fas fa-check"></i>${i}</li>`).join('')}</ul>`;
        document.getElementById('sList').innerHTML = `<ul>${d.s.map(i => `<li><i class="fas fa-info-circle"></i>${i}</li>`).join('')}</ul>`;
        
        // تحديث التبويبات
        document.getElementById('tabMText').innerText = lang[currentLang].m;
        document.getElementById('tabSText').innerText = lang[currentLang].s;
        
        // تحديث المعلومات البنكية
        document.getElementById('accOwner').innerText = lang[currentLang].owner;
        
        // تحديث الأزرار
        document.getElementById('btnText').innerText = lang[currentLang].btn;
        document.getElementById('mailLabelText').innerText = lang[currentLang].label;
        document.getElementById('copyText').innerText = lang[currentLang].copy;
        
        // تحديث أزرار التنقل النشطة
        if (btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        
        // تحديث شبكة الأسعار
        const grid = document.getElementById('priceGrid');
        grid.innerHTML = p.map(x => `
            <div class="chip" onclick="setP(${x.v}, '${x.n[currentLang]}', this)">
                <div class="period">${x.n[currentLang]}</div>
                <div class="price">${x.v} ${lang[currentLang].curr}</div>
            </div>
        `).join('');
        
        // تعيين السعر الافتراضي
        setP(p[p.length - 1].v, p[p.length - 1].n[currentLang], grid.lastChild);
        
        // إظهار/إخفاء حقل الإيميل
        document.getElementById('emailBox').style.display = id === 'canva' ? 'block' : 'none';
        
        // تعيين التبويب الافتراضي
        setTab('m');
        
        // إعادة تعيين شريط التقدم بعد ثانية
        setTimeout(() => {
            document.getElementById('progressFill').style.width = '0%';
        }, 1000);
    }

    // وظيفة تعيين السعر
    function setP(v, n, el) {
        activeV = v;
        activeN = n;
        document.getElementById('priceShow').innerHTML = v + `<span> ${lang[currentLang].curr}</span>`;
        
        if (el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }
    }

    // وظيفة تعيين التبويب
    function setTab(t) {
        document.getElementById('mList').classList.toggle('active', t === 'm');
        document.getElementById('sList').classList.toggle('active', t === 's');
        document.getElementById('tabM').classList.toggle('active', t === 'm');
        document.getElementById('tabS').classList.toggle('active', t === 's');
    }

    // وظيفة تبديل اللغة
    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const h = document.getElementById('htmlTag');
        h.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        h.lang = currentLang;
        
        document.getElementById('langText').innerText = lang[currentLang].lang;
        renderNav();
        loadP(activeID);
    }

    // وظيفة تبديل الثيم
    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.getElementById('bodyTag').classList.toggle('light-mode');
        
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        if (currentTheme === 'light') {
            themeIcon.className = 'fas fa-moon';
            themeText.innerText = currentLang === 'ar' ? 'وضع الليل' : 'Dark Mode';
        } else {
            themeIcon.className = 'fas fa-sun';
            themeText.innerText = currentLang === 'ar' ? 'وضع النهار' : 'Light Mode';
        }
    }

    // وظيفة نسخ رقم الحساب
    function copyAccount() {
        const accountNumber = "SA0315000900133520020007";
        navigator.clipboard.writeText(accountNumber).then(() => {
            showToast(lang[currentLang].copied);
        });
    }

    // وظيفة عرض رسالة التنبيه
    function showToast(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').innerText = message;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // وظيفة الانتقال للواتساب
    function goToChat() {
        const e = document.getElementById('userEmail').value;
        if (activeID === 'canva' && !e) {
            showToast(lang[currentLang].wait);
            return;
        }
        
        let m = currentLang === 'ar' 
            ? `مرحباً سليمان 👋 أطلب اشتراك ${products[activeID].ar.h} - باقة ${activeN} بسعر ${activeV} ريال` 
            : `Hello 👋 I want to order ${products[activeID].en.h} - Plan ${activeN} for ${activeV} SAR`;
        
        if (e) m += ` - Email: ${e}`;
        
        window.open(`https://wa.me/966591388202?text=${encodeURIComponent(m)}`, '_blank');
    }

    // تهيئة الصفحة عند التحميل
    window.onload = () => {
        renderNav();
        loadP('netflix');
        
        // تعيين النص الأولي للأزرار
        document.getElementById('langText').innerText = lang[currentLang].lang;
        document.getElementById('themeText').innerText = lang[currentLang].theme;
        document.getElementById('copyText').innerText = lang[currentLang].copy;
    };
</script>
</body>
</html>
