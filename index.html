<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | متجر متخصص اشتراكات الرقميه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --text-main: #ffffff;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg-base: #f0f2f5;
            --text-main: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        /* أنظمة الألوان الديناميكية */
        body.theme-autodesk { --accent-color: #00d2ff; --glow-color: rgba(0, 210, 255, 0.3); } 
        body.theme-windows { --accent-color: #00a884; --glow-color: rgba(0, 168, 132, 0.3); } 
        body.theme-adobe { --accent-color: #ff0054; --glow-color: rgba(255, 0, 84, 0.3); }
        body.theme-linkedin { --accent-color: #0077b5; --glow-color: rgba(0, 119, 181, 0.3); }
        body.theme-youtube { --accent-color: #ff0000; --glow-color: rgba(255, 0, 0, 0.3); }
        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.3); }
        body.theme-shahid { --accent-color: #00d982; --glow-color: rgba(0, 217, 130, 0.3); }
        body.theme-crunchy { --accent-color: #ff6400; --glow-color: rgba(255, 100, 0, 0.3); }
        body.theme-office { --accent-color: #eb3c00; --glow-color: rgba(235, 60, 0, 0.3); }
        body.theme-fasel { --accent-color: #ffc107; --glow-color: rgba(255, 193, 7, 0.3); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; transition: var(--transition); }

        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 0%), var(--glow-color) 0%, transparent 60%); z-index: -1; pointer-events: none; transition: background 0.8s ease; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; width: 100%; flex: 1; }

        header { padding: 40px 0; animation: fadeInDown 0.8s ease; }
        .logo { font-size: 45px; font-weight: 900; letter-spacing: 8px; color: var(--accent-color); text-shadow: 0 0 20px var(--glow-color); transition: var(--transition); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 12px; margin: 30px 0; }
        .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px 5px; cursor: pointer; transition: var(--transition); backdrop-filter: blur(5px); }
        .card:hover { transform: translateY(-10px) scale(1.05); border-color: var(--accent-color); box-shadow: 0 15px 35px var(--glow-color); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.08); }
        .card i { font-size: 28px; margin-bottom: 10px; color: var(--accent-color); }
        .card h3 { font-size: 10px; font-weight: 700; }

        #checkout { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 35px; padding: 40px 20px; margin-bottom: 60px; display: none; animation: slideUp 0.6s ease; backdrop-filter: blur(15px); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 20px 0; }
        .plan-btn { background: rgba(128,128,128,0.05); border: 1px solid var(--glass-border); padding: 15px; border-radius: 18px; cursor: pointer; color: var(--text-main); transition: 0.3s; }
        .plan-btn.selected { background: var(--accent-color); color: #000; font-weight: 800; border-color: var(--accent-color); }

        .info-panel { background: var(--glass); border: 1px solid var(--glass-border); padding: 25px; border-radius: 20px; text-align: right; margin: 20px 0; font-size: 13px; }
        html[dir="ltr"] .info-panel { text-align: left; }

        .bank-section { background: #000; border: 1px solid var(--glass-border); border-radius: 30px; padding: 35px; max-width: 500px; margin: 40px auto 0; color: #fff; }
        .iban-container { width: 100%; background: rgba(255,255,255,0.02); border: 2px dashed #ff0000; padding: 18px; border-radius: 15px; margin: 25px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden; }
        .iban-text { font-family: 'Courier New', monospace; font-size: clamp(11px, 3.8vw, 16px); color: #ff0000; font-weight: 900; white-space: nowrap; }

        .btn-order { width: 100%; background: #ff0000; color: #fff; border: none; padding: 20px; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); } 70% { box-shadow: 0 0 0 15px rgba(255,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); } }

        footer { padding: 40px 0; text-align: center; font-size: 13px; opacity: 0.6; border-top: 1px solid var(--glass-border); margin-top: auto; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #000; padding: 12px 30px; border-radius: 50px; display: none; z-index: 2000; font-weight: 800; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div class="toast" id="toast"></div>

    <div class="container">
        <header>
            <div class="controls">
                <button class="control-btn" id="langToggle" onclick="toggleLang()">English</button>
                <button class="control-btn" id="themeToggle" onclick="toggleTheme()">الوضع النهاري</button>
            </div>
            <div class="logo">NIKAI</div>
            <p id="sub-title" style="opacity: 0.7; margin-top: 10px;">متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان</p>
        </header>

        <div class="grid" id="mainGrid"></div>

        <section id="checkout">
            <h2 id="s-title" style="font-size: 32px; font-weight: 900; margin-bottom: 5px;"></h2>
            <div id="s-badge" style="background:var(--accent-color); color:#000; display:inline-block; padding:4px 15px; border-radius:50px; font-size:11px; font-weight:800; margin-bottom:20px;"></div>
            
            <div class="plans-grid" id="s-plans"></div>

            <div id="dynamic-fields" style="margin: 25px 0; text-align: right;">
                <div id="email-group">
                    <label id="l-email" style="font-size:13px; opacity:0.8; display:block; margin-bottom:8px;"></label>
                    <input type="email" id="u-email" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--glass-border); background:rgba(128,128,128,0.05); color:var(--text-main); margin-bottom:15px;" placeholder="mail@example.com">
                </div>
                <div id="pass-group" style="display:none;">
                    <label id="l-pass" style="font-size:13px; opacity:0.8; display:block; margin-bottom:8px;"></label>
                    <input type="text" id="u-pass" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--glass-border); background:rgba(128,128,128,0.05); color:var(--text-main);" placeholder="Password">
                </div>
            </div>

            <div class="info-panel">
                <strong id="l-info"></strong>
                <ul id="s-info"></ul>
            </div>

            <div class="bank-section">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span id="l-bank">البنك:</span><strong>بنك البلاد</strong></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span id="l-user">المستفيد:</span><strong>سليمان فلاته</strong></div>
                <div class="iban-container" onclick="copyIBAN()">
                    <span class="iban-text">SA0315000900133520020007</span>
                    <i class="fas fa-copy" style="font-size: 14px; opacity: 0.6;"></i>
                </div>
                <button class="btn-order" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> <span id="l-confirm">تأكيد الطلب عبر واتساب</span>
                </button>
            </div>
        </section>
    </div>

    <footer id="l-footer">جميع الحقوق محفوظه للمتجر NIKAI</footer>

    <script>
        document.addEventListener('mousemove', e => {
            document.body.style.setProperty('--mouse-x', (e.clientX / window.innerWidth) * 100 + '%');
            document.body.style.setProperty('--mouse-y', (e.clientY / window.innerHeight) * 100 + '%');
        });

        let lang = 'ar';
        const products = {
            autodesk: { icon: 'fas fa-drafting-compass', name: {ar:"أوتوديسك", en:"Autodesk"}, badge: {ar:"أصلي 100%", en:"100% Genuine"}, plans: [{l:{ar:"6 أشهر", en:"6 Months"}, p:"150 ريال"}, {l:{ar:"12 شهر", en:"12 Months"}, p:"250 ريال"}], info: {ar:["جميع البرامج","تحديثات رسمية"], en:["All Apps","Official Updates"]}, email: true },
            windows: { icon: 'fab fa-windows', name: {ar:"ويندوز", en:"Windows"}, plans: [{l:{ar:"10 Pro", en:"10 Pro"}, p:"24.99 ريال"}, {l:{ar:"11 Pro", en:"11 Pro"}, p:"28.99 ريال"}, {l:{ar:"10 Home", en:"10 Home"}, p:"33.99 ريال"}], info: {ar:["تنشيط مدى الحياة","دعم رسمي"], en:["Lifetime Activation","Official Support"]}, email: false },
            adobe: { icon: 'fas fa-palette', name: {ar:"أدوبي", en:"Adobe CC"}, plans: [{l:{ar:"حساب مشترك (شهر)", en:"Shared (1mo)"}, p:"68 ريال"}, {l:{ar:"حساب شخصي (شهر)", en:"Personal (1mo)"}, p:"99 ريال", t:"p"}, {l:{ar:"حساب شخصي (سنة)", en:"Personal (1yr)"}, p:"999 ريال", t:"p"}], info: {ar:["فوتوشوب وإلستريتور","أصلي 100%"], en:["Photoshop & AI","100% Genuine"]}, email: true },
            youtube: { icon: 'fab fa-youtube', name: {ar:"يوتيوب بريميوم", en:"YouTube Premium"}, plans: [{l:{ar:"دعوة عائلية (سنة)", en:"Invite (1yr)"}, p:"200 ريال", t:"inv"}, {l:{ar:"فردي خاص (سنة)", en:"Individual (1yr)"}, p:"350 ريال", t:"ind"}], info: {ar:["بدون إعلانات","خلفية"], en:["No Ads","Background Play"]}, email: true },
            netflix: { icon: 'fas fa-film', name: {ar:"نتفليكس", en:"Netflix"}, plans: [{l:{ar:"شهر (ملف خاص)", en:"1mo (Private)"}, p:"20 ريال"}, {l:{ar:"سنة (ملف خاص)", en:"1yr (Private)"}, p:"200 ريال"}], info: {ar:["جودة 4K UHD","ضمان كامل"], en:["4K UHD Quality","Full Warranty"]}, email: false },
            shahid: { icon: 'fas fa-play-circle', name: {ar:"شاهد VIP", en:"Shahid VIP"}, plans: [{l:{ar:"شهر (مشترك)", en:"1mo (Shared)"}, p:"20 ريال"}, {l:{ar:"سنة (مشترك)", en:"1yr (Shared)"}, p:"200 ريال"}], info: {ar:["بث المباريات","جودة 4K"], en:["Sports Stream","4K Quality"]}, email: false },
            chatgpt: { icon: 'fas fa-robot', name: {ar:"ChatGPT Plus", en:"ChatGPT Plus"}, plans: [{l:{ar:"شهر (مشترك)", en:"1mo (Shared)"}, p:"10 ريال"}, {l:{ar:"سنة (مشترك)", en:"1yr (Shared)"}, p:"100 ريال"}], info: {ar:["نموذج GPT-5","سرعة فائقة"], en:["GPT-5 Model","High Speed"]}, email: false },
            crunchy: { icon: 'fas fa-tv', name: {ar:"كرانشي رول", en:"Crunchyroll"}, plans: [{l:{ar:"سنة (ملف خاص)", en:"1yr (Private)"}, p:"50 ريال"}], info: {ar:["مشاهدة الأنمي","بدون إعلانات"], en:["Anime Stream","No Ads"]}, email: false },
            office: { icon: 'fas fa-file-word', name: {ar:"أوفيس 365", en:"Office 365"}, plans: [{l:{ar:"مدى الحياة", en:"Lifetime"}, p:"45 ريال"}], info: {ar:["5 أجهزة","أصلي 100%"], en:["5 Devices","100% Genuine"]}, email: false },
            fasel: { icon: 'fas fa-bolt', name: {ar:"فاصل بلس", en:"Fasel Plus"}, plans: [{l:{ar:"شهر", en:"1mo"}, p:"13 ريال"}, {l:{ar:"سنة", en:"1yr"}, p:"89 ريال"}], info: {ar:["أفلام ومسلسلات","بدون إعلانات"], en:["Movies & Series","No Ads"]}, email: false },
            linkedin: { icon: 'fab fa-linkedin', name: {ar:"لينكد إن", en:"LinkedIn"}, plans: [{l:{ar:"شهر", en:"1mo"}, p:"80 ريال"}, {l:{ar:"سنة", en:"1yr"}, p:"600 ريال"}], info: {ar:["باقة Business","ظهور 4x"], en:["Business Plan","4x Visibility"]}, email: true },
            osn: { icon: 'fas fa-plus-circle', name: {ar:"OSN+", en:"OSN+"}, plans: [{l:{ar:"سنة", en:"1yr"}, p:"110 ريال"}], info: {ar:["محتوى حصري","جودة 4K"], en:["Exclusive Content","4K Quality"]}, email: false }
        };

        const ui = {
            ar: { sub: "متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان", info: "مميزات الاشتراك:", email: "البريد الإلكتروني:", pass: "كلمة المرور:", bank: "البنك:", user: "المستفيد:", confirm: "تأكيد الطلب عبر واتساب", copy: "تم النسخ ✅", footer: "جميع الحقوق محفوظه للمتجر NIKAI", themeL: "الوضع النهاري", themeD: "الوضع الليلي" },
            en: { sub: "Digital Subscriptions Specialist - Order Now", info: "Features:", email: "Email Address:", pass: "Password:", bank: "Bank:", user: "Beneficiary:", confirm: "Confirm via WhatsApp", copy: "Copied ✅", footer: "All Rights Reserved - NIKAI Store", themeL: "Day Mode", themeD: "Night Mode" }
        };

        function renderGrid() {
            document.getElementById('mainGrid').innerHTML = Object.keys(products).map(id => `
                <div class="card" onclick="selectService('${id}')" id="card-${id}">
                    <i class="${products[id].icon}"></i>
                    <h3>${products[id].name[lang]}</h3>
                </div>
            `).join('');
        }

        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langToggle').innerText = lang === 'ar' ? 'English' : 'العربية';
            document.getElementById('sub-title').innerText = ui[lang].sub;
            document.getElementById('l-footer').innerText = ui[lang].footer;
            renderGrid();
            document.getElementById('checkout').style.display = 'none';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isL = document.body.classList.contains('light-mode');
            document.getElementById('themeToggle').innerText = isL ? ui[lang].themeD : ui[lang].themeL;
        }

        let selP = "", selL = "", selT = "";
        function selectService(id) {
            document.body.className = (document.body.classList.contains('light-mode') ? 'light-mode ' : '') + 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + id).classList.add('active');
            
            const s = products[id];
            const pnl = document.getElementById('checkout');
            pnl.style.display = 'block';
            document.getElementById('s-title').innerText = s.name[lang];
            document.getElementById('s-badge').innerText = s.badge ? s.badge[lang] : (lang === 'ar' ? "حساب مشترك - ملف خاص" : "Shared Profile");
            
            document.getElementById('s-plans').innerHTML = s.plans.map(p => `
                <div class="plan-btn" onclick="setPlan(this, '${p.p}', '${p.l[lang]}', '${p.t || ''}')">
                    <div>${p.l[lang]}</div>
                    <strong>${p.p}</strong>
                </div>
            `).join('');

            document.getElementById('l-info').innerText = ui[lang].info;
            document.getElementById('s-info').innerHTML = s.info[lang].map(i => `<li>${i}</li>`).join('');
            
            document.getElementById('dynamic-fields').style.display = s.email ? 'block' : 'none';
            document.getElementById('l-email').innerText = ui[lang].email;
            document.getElementById('l-pass').innerText = ui[lang].pass;
            document.getElementById('l-bank').innerText = ui[lang].bank;
            document.getElementById('l-user').innerText = ui[lang].user;
            document.getElementById('l-confirm').innerText = ui[lang].confirm;

            document.querySelector('.plan-btn').click();
            window.scrollTo({ top: pnl.offsetTop - 30, behavior: 'smooth' });
        }

        function setPlan(el, p, l, t) {
            document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected'); selP = p; selL = l; selT = t;
            document.getElementById('pass-group').style.display = (t === 'ind' || t === 'p') ? 'block' : 'none';
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.innerText = ui[lang].copy; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function placeOrder() {
            const email = document.getElementById('u-email').value;
            const pass = document.getElementById('u-pass').value;
            let msg = `Order: ${document.getElementById('s-title').innerText}\nPlan: ${selL}\nPrice: ${selP}`;
            if(email) msg += `\nEmail: ${email}`;
            if(pass && (selT === 'ind' || selT === 'p')) msg += `\nPass: ${pass}`;
            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }

        renderGrid();
    </script>
</body>
</html>
