<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CINEMA | تجربة النخبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Cairo', sans-serif;
            background: #000; color: #fff;
            overflow: hidden; /* جعل الموقع كأنه تطبيق */
        }

        /* الخلفية السينمائية */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=2070&auto=format&fit=crop') center/cover;
            filter: brightness(0.3) blur(5px);
            z-index: -1;
            transform: scale(1.1);
        }

        /* الحاوية المركزية */
        .wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cinema-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 900px;
            height: 550px;
            border-radius: 40px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            position: relative;
        }

        /* الجانب الأيمن: المحتوى */
        .content {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .label {
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 10px;
            border-right: 2px solid #E50914;
            padding-right: 10px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .price-section {
            margin: 30px 0;
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .price { font-size: 4rem; font-weight: 200; }
        .currency { font-size: 1.2rem; color: #888; }

        .desc {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 200;
        }

        /* زر الأكشن المختصر */
        .buy-btn {
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 18px 45px;
            border-radius: 100px;
            font-weight: 900;
            width: fit-content;
            transition: 0.4s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .buy-btn:hover {
            background: #E50914;
            color: #fff;
            transform: scale(1.05);
        }

        /* الجانب الأيسر: الصورة التعبيرية */
        .visual {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1616530940355-351fabd9524b?q=80&w=1935&auto=format&fit=crop') center/cover;
            position: relative;
        }

        .visual::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.8), transparent);
        }

        /* ميزات صغيرة في الأسفل */
        .mini-features {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 20px;
            font-size: 0.7rem;
            color: #666;
        }

        @media (max-width: 768px) {
            .cinema-card { flex-direction: column; height: auto; border-radius: 25px; }
            .visual { height: 200px; }
            .content { padding: 40px 30px; }
            h1 { font-size: 2.2rem; }
            .price { font-size: 3rem; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <div class="bg-video"></div>

    <div class="wrapper">
        <div class="cinema-card">
            
            <div class="content">
                <div class="label">اشتراك بريميوم 2026</div>
                <h1>نتفليكس<br><span style="font-weight: 200;">سنة كاملة</span></h1>
                
                <div class="price-section">
                    <span class="price">200</span>
                    <span class="currency">ريال سعودي / مدفوعة مرة واحدة</span>
                </div>

                <p class="desc">
                    استمتع بخصوصية تامة مع ملفك الشخصي الخاص. جودة 4K Ultra HD، ضمان ذهبي لمدة 365 يوماً، ودعم فني متواصل.
                </p>

                <a href="https://wa.me/966591388202" class="buy-btn">
                    اشترك الآن 
                    <span style="font-size: 1.2rem;">→</span>
                </a>

                <div class="mini-features">
                    <span>• ملف خاص برمز سري</span>
                    <span>• ضمان استبدال فوري</span>
                    <span>• يعمل على جميع الأجهزة</span>
                </div>
            </div>

            <div class="visual"></div>

        </div>
    </div>

</body>
</html>
