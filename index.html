<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | فخامة الاختيار</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.2); }
        body.theme-disney { --accent-color: #0063e5; --glow-color: rgba(0, 99, 229, 0.2); }
        body.theme-canva { --accent-color: #00c4cc; --glow-color: rgba(0, 196, 204, 0.2); }
        body.theme-fasel { --accent-color: #ffc107; --glow-color: rgba(255, 193, 7, 0.2); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-base); color: #fff; overflow-x: hidden; transition: var(--transition); }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--glow-color) 0%, transparent 70%);
            z-index: -1; transition: var(--transition);
        }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; text-align: center; }

        header { padding: 50px 0; }
        .logo { font-size: 45px; font-weight: 900; letter-spacing: 8px; color: var(--accent-color); transition: var(--transition); text-shadow: 0 0 20px var(--glow-color); }

        /* واجهة المنتجات - بدون أسعار */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 50px; }
        .card {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 40px 20px; cursor: pointer; transition: var(--transition);
        }
        .card:hover { transform: translateY(-8px); background: rgba(255,255,255,0.06); border-color: var(--accent-color); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.1); box-shadow: 0 10px 40px var(--glow-color); }
        .card i { font-size: 35px; margin-bottom: 15px; color: var(--accent-color); }
        .card h3 { font-size: 16px; font-weight: 700; letter-spacing: 1px; }

        /* منطقة التفاصيل */
        #checkout {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 35px;
            padding: 40px; margin-bottom: 60px; display: none; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .service-head h2 { font-size: 35px; font-weight: 900; color: var(--accent-color); margin-bottom: 5px; }
        
        /* نظام الباقات */
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 25px 0; }
        .plan-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 15px;
            border-radius: 15px; cursor: pointer; color: #fff; transition: 0.3s;
        }
        .plan-btn:hover { border-color: var(--accent-color); }
        .plan-btn.selected { background: var(--accent-color); color: #fff; border-color: var(--accent-color); font-weight: 700; }
        .plan-btn div { font-size: 12px; opacity: 0.8; }
        .plan-btn strong { font-size: 18px; display: block; margin-top: 5px; }

        .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .feat-tag { font-size: 13px; background: rgba(255,255,255,0.05); padding: 6px 15px; border-radius: 50px; border: 1px solid var(--glass-border); }

        /* وزنية البنك - تعديل التمركز */
        .bank-section {
            background: #000; border: 1px solid var(--glass-border); border-radius: 25px;
            padding: 30px; max-width: 450px; margin: 30px auto 0; /* التوسيط المثالي */
            display: flex; flex-direction: column; align-items: center; /* توحيد المركز */
        }
        .bank-info { width: 100%; margin-bottom: 15px; }
        .bank-row { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; font-size: 14px; opacity: 0.9; }
        
        .iban-container {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px dashed var(--accent-color);
            padding: 15px; border-radius: 12px; margin: 10px 0; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .iban-container:hover { background: rgba(255,255,255,0.08); }
        .iban-num { font-family: monospace; font-size: 16px; color: var(--accent-color); letter-spacing: 1px; }

        .order-button {
            width: 100%; background: var(--accent-color); color: #fff; border: none;
            padding: 18px; border-radius: 12px; font-weight: 700; font-size: 18px;
            cursor: pointer; margin-top: 20px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .order-button:hover { transform: scale(1.02); filter: brightness(1.1); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent-color); color: #fff; padding: 12px 25px; border-radius: 10px; display: none; z-index: 1000; }

        @media (max-width: 500px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body class="theme-default">

    <div class="ambient-bg"></div>
    <div class="toast" id="toast">تم نسخ الحساب البنكي ✅</div>

    <div class="container">
        <header>
            <div class="logo">NIKAI</div>
            <p style="opacity: 0.5;">فخامة المحتوى الرقمي بين يديك</p>
        </header>

        <div class="grid">
            <div class="card" onclick="openService('netflix')">
                <i class="fas fa-film"></i>
                <h3>نتفليكس</h3>
            </div>
            <div class="card" onclick="openService('disney')">
                <i class="fas fa-crown"></i>
                <h3>ديزني بلس</h3>
            </div>
            <div class="card" onclick="openService('canva')">
                <i class="fas fa-palette"></i>
                <h3>كانفا برو</h3>
            </div>
            <div class="card" onclick="openService('fasel')">
                <i class="fas fa-play"></i>
                <h3>فاصل بلس</h3>
            </div>
        </div>

        <section id="checkout">
            <div class="service-head">
                <h2 id="s-title">الخدمة</h2>
                <div class="features" id="s-feats"></div>
            </div>

            <p style="margin-top: 20px; font-weight: 600;">اختر مدة الاشتراك:</p>
            <div class="plans-grid" id="s-plans"></div>

            <div id="email-field" style="display:none; margin-top: 20px;">
                <input type="email" id="u-email" style="width:100%; padding:15px; border-radius:10px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); color:#fff; text-align:center;" placeholder="ضع إيميلك الشخصي للتفعيل">
            </div>

            <div class="bank-section">
                <div class="bank-info">
                    <div class="bank-row"><span>البنك:</span><strong>بنك البلاد</strong></div>
                    <div class="bank-row"><span>المستفيد:</span><strong>سليمان فلاته</strong></div>
                </div>
                
                <div class="iban-container" onclick="copyIBAN()">
                    <span class="iban-num">SA0315000900133520020007</span>
                    <i class="fas fa-copy" style="font-size: 12px; opacity: 0.6;"></i>
                </div>

                <button class="order-button" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> تأكيد الطلب عبر واتساب
                </button>
            </div>
        </section>
    </div>

    <script>
        const services = {
            netflix: {
                name: "نتفليكس بريميوم",
                feats: ["ملف خاص بك", "شاشة واحدة", "جودة 4K", "ضمان ذهبي"],
                plans: [
                    { label: "شهر واحد", price: "20 ريال" },
                    { label: "3 أشهر", price: "75 ريال" },
                    { label: "6 أشهر", price: "120 ريال" },
                    { label: "سنة كاملة", price: "200 ريال" }
                ],
                needEmail: false
            },
            disney: {
                name: "ديزني بلس",
                feats: ["ملف خاص", "محتوى أصلي", "ترجمة كاملة", "بدون إعلانات"],
                plans: [
                    { label: "شهر واحد", price: "20 ريال" },
                    { label: "6 أشهر", price: "120 ريال" },
                    { label: "سنة كاملة", price: "200 ريال" }
                ],
                needEmail: false
            },
            fasel: {
                name: "فاصل بلس",
                feats: ["ملف خاص", "أعلى جودة", "تطبيق ذكي", "تحديث يومي"],
                plans: [
                    { label: "شهر واحد", price: "13 ريال" },
                    { label: "3 أشهر", price: "29 ريال" },
                    { label: "6 أشهر", price: "49 ريال" },
                    { label: "سنة كاملة", price: "89 ريال" }
                ],
                needEmail: false
            },
            canva: {
                name: "كانفا برو",
                feats: ["تفعيل إيميلك الشخصي", "قوالب بلا حدود", "مدى الحياة", "دعم فني"],
                plans: [{ label: "مدى الحياة", price: "39 ريال" }],
                needEmail: true
            }
        };

        let selectedPlanPrice = "";
        let selectedPlanLabel = "";

        function openService(id) {
            document.body.className = 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const s = services[id];
            document.getElementById('checkout').style.display = 'block';
            document.getElementById('s-title').innerText = s.name;
            
            // المزايا
            document.getElementById('s-feats').innerHTML = s.feats.map(f => `<span class="feat-tag">${f}</span>`).join('');

            // الباقات
            document.getElementById('s-plans').innerHTML = s.plans.map((p, i) => `
                <div class="plan-btn" onclick="selectPlan(this, '${p.price}', '${p.label}')">
                    <div>${p.label}</div>
                    <strong>${p.price}</strong>
                </div>
            `).join('');

            document.getElementById('email-field').style.display = s.needEmail ? 'block' : 'none';
            
            // اختيار أول باقة تلقائياً
            const firstPlan = document.querySelector('.plan-btn');
            if(firstPlan) firstPlan.click();

            window.scrollTo({ top: document.getElementById('checkout').offsetTop - 20, behavior: 'smooth' });
        }

        function selectPlan(el, price, label) {
            document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedPlanPrice = price;
            selectedPlanLabel = label;
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function placeOrder() {
            const activeId = document.body.className.replace('theme-', '');
            const s = services[activeId];
            const email = document.getElementById('u-email').value;

            if(s.needEmail && !email) { alert("لطفاً أدخل الإيميل لإتمام الطلب"); return; }

            let msg = `مرحباً نيكاي 👋\nأطلب اشتراك: ${s.name}\nالباقة: ${selectedPlanLabel}\nالسعر: ${selectedPlanPrice}`;
            if(email) msg += `\nالإيميل: ${email}`;
            msg += `\n\nقمت بالتحويل البنكي، إليك الإيصال:`;

            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
