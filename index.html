<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX ELITE | التجربة المطلقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914;
            --gold: #D4AF37;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.01);
            --border: rgba(255, 255, 255, 0.07);
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* محرك الإضاءة الخلفية التفاعلي */
        .cursor-glow {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.12) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: -1;
            transform: translate(-50%, -50%); transition: 0.15s ease-out;
            filter: blur(50px);
        }

        .main-wrapper {
            width: 90%; max-width: 1100px;
            display: flex; flex-direction: column; gap: 30px;
            opacity: 0; transform: scale(0.9);
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .main-wrapper.active { opacity: 1; transform: scale(1); }

        /* الكرت الرئيسي: تأثير السينما */
        .hero-card {
            background: var(--glass);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid var(--border);
            border-radius: 45px;
            padding: 60px;
            display: grid; grid-template-columns: 1.2fr 1fr;
            gap: 40px; align-items: center;
            position: relative; overflow: hidden;
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .hero-card:hover {
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
        }

        /* أنيميشن النص */
        .reveal-text {
            overflow: hidden; display: inline-block; vertical-align: bottom;
        }
        .reveal-text span {
            display: inline-block; transform: translateY(100%);
            transition: 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .active .reveal-text span { transform: translateY(0); }

        h1 { font-size: 4.5rem; font-weight: 900; margin: 0; line-height: 0.85; }
        .price-display { font-size: 7rem; font-weight: 200; color: #fff; text-align: left; }

        /* الأيقونات الذكية */
        .features-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        }

        .f-box {
            background: rgba(255,255,255,0.02);
            padding: 25px; border-radius: 30px; text-align: center;
            border: 1px solid var(--border);
            transition: 0.5s ease;
        }
        .f-box:hover {
            background: rgba(229, 9, 20, 0.05);
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        /* زر الأكشن "النيوني" */
        .btn-ultimate {
            background: #fff; color: #000;
            text-decoration: none; padding: 25px 60px;
            border-radius: 100px; text-align: center;
            font-size: 1.8rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center; gap: 25px;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .btn-ultimate:hover {
            background: var(--primary); color: #fff;
            transform: scale(1.03) translateY(-8px);
            box-shadow: 0 30px 60px rgba(229, 9, 20, 0.5);
        }

        .guarantee-label {
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.15), transparent);
            padding: 20px; border-radius: 100px; text-align: center;
            border: 1px solid rgba(212,175,55,0.2); color: var(--gold);
            font-weight: 900; letter-spacing: 5px; font-size: 0.8rem;
        }

        @media (max-width: 800px) {
            .hero-card { grid-template-columns: 1fr; padding: 40px 20px; text-align: center; }
            .price-display { text-align: center; font-size: 5rem; }
            h1 { font-size: 3rem; }
            .features-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="cursor-glow" id="glow"></div>

    <div class="main-wrapper" id="wrapper">
        
        <div class="features-grid">
            <div class="f-box">🎬 UHD 4K QUALITY</div>
            <div class="f-box">🔒 PRIVATE PROFILE</div>
            <div class="f-box">🛡️ 365 DAYS GUARANTEE</div>
        </div>

        <div class="hero-card" id="card">
            <div class="content-side">
                <div style="color: var(--primary); font-weight: 600; letter-spacing: 8px; margin-bottom: 20px;">ELITE MEMBERSHIP</div>
                <h1 class="reveal-text"><span>نـتـفـلـيـكـس</span></h1>
                <h1 class="reveal-text" style="font-weight: 200;"><span>سنة كاملة</span></h1>
                <p style="color: #777; margin-top: 30px; font-size: 1.1rem; line-height: 1.6;">بوابتك الحصرية لعالم من المحتوى اللامتناهي بخصوصية مطلقة وضمان استبدال فوري.</p>
            </div>

            <div class="price-side">
                <div class="price-display" id="price">0</div>
                <div style="text-align: left; font-size: 1rem; color: #444; font-weight: 900; margin-top: -10px;">SAR / ANNUAL PLAN</div>
            </div>
        </div>

        <div class="guarantee-label">
            الـضـمـان الـذهـبـي : تـعـويـض فـوري طـوال الـسـنـة 💎
        </div>

        <a href="https://wa.me/966591388202" class="btn-ultimate">
            تفعيل الاشتراك الآن
            <span style="font-size: 2.5rem;">→</span>
        </a>

    </div>

    <script>
        // محرك إضاءة الماوس
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // تشغيل الأنيميشن عند التحميل
        window.onload = () => {
            document.getElementById('wrapper').classList.add('active');
            animateValue(document.getElementById('price'), 0, 200, 2000);
        };

        // عداد السعر السلس
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // تأثير الميلان ثلاثي الأبعاد للكرت
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
    </script>
</body>
</html>
