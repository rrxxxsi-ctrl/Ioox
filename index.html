<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX ELITE V11 | تجربة جيل القادم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914;
            --accent: #FFD700;
            --dark: #000000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: #fff;
            overflow: hidden; /* لمنع السكرول التقليدي واعتماد نظام الشرائح */
        }

        /* خلفية جزيئات متحركة بالـ CSS */
        .bg-animate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0505 0%, #000 100%);
            z-index: -1;
        }

        .blob {
            position: absolute; width: 400px; height: 400px;
            background: var(--primary);
            filter: blur(150px); opacity: 0.15;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(50%, 50%); }
        }

        /* تصميم الشريحة المركزية */
        .slide {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 60px;
            max-width: 800px;
            width: 100%;
            position: relative;
            transform: perspective(1000px);
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .price-text {
            font-size: 6rem;
            font-weight: 200;
            color: var(--accent);
            margin: 20px 0;
        }

        /* نظام الأزرار التفاعلية */
        .cta-container {
            margin-top: 40px;
        }

        .magnetic-btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 25px 60px;
            border-radius: 100px;
            font-size: 1.5rem;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 20px 40px rgba(229, 9, 20, 0.3);
            transition: 0.3s;
            position: relative;
        }

        .magnetic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 30px 60px rgba(229, 9, 20, 0.5);
        }

        /* شريط المعلومات السفلي */
        .info-bar {
            position: fixed; bottom: 30px; width: 100%;
            display: flex; justify-content: center; gap: 50px;
            font-size: 0.8rem; color: #555;
            letter-spacing: 2px;
        }

        .counter-box {
            position: absolute; top: 30px; right: 40px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px; border-radius: 15px;
            font-size: 0.9rem; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .live-dot {
            height: 8px; width: 8px; background: #22c55e;
            display: inline-block; border-radius: 50%; margin-left: 8px;
            box-shadow: 0 0 10px #22c55e;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .price-text { font-size: 4rem; }
            .glass-panel { padding: 40px 20px; border-radius: 30px; }
            .info-bar { gap: 20px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="bg-animate">
        <div class="blob"></div>
    </div>

    <div class="slide">
        <div class="glass-panel" id="panel">
            <div class="counter-box">
                <span id="stock-count">8</span> حسابات متوفرة الآن <div class="live-dot"></div>
            </div>

            <div style="color: var(--primary); font-weight: 600; letter-spacing: 5px;">EXCLUSIVE OFFER</div>
            <h1>نـتـفـلـيـكـس<br>VIP</h1>
            
            <div class="price-text">200 <span style="font-size: 1.5rem; color: #fff;">ريال / سنة</span></div>
            
            <p style="color: #888; line-height: 1.6; max-width: 500px; margin: 0 auto;">
                استلم ملفك الخاص (Private Profile) فوراً بضمان ذهبي شامل 365 يوم ودقة 4K كاملة.
            </p>

            <div class="cta-container">
                <a href="https://wa.me/966591388202" class="magnetic-btn" id="buyBtn">تفعيل الاشتراك</a>
            </div>
        </div>
    </div>

    <div class="info-bar">
        <span>4K ULTRA HD</span>
        <span>ضمان استبدال فوري</span>
        <span>دعم فني 24/7</span>
    </div>

    <script>
        // تأثير إمالة اللوحة (3D Tilt) مع الماوس
        const panel = document.getElementById('panel');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            panel.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // تأثير الزر المغناطيسي (Magnetic Button)
        const btn = document.getElementById('buyBtn');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) scale(1.1)`;
        });

        btn.addEventListener('mouseleave', () => {
            btn.style.transform = `translate(0px, 0px) scale(1)`;
        });

        // نظام نقص الكمية الوهمي (لزيادة الطلب)
        let count = 8;
        setInterval(() => {
            if(count > 2) {
                count--;
                document.getElementById('stock-count').innerText = count;
                document.getElementById('stock-count').style.color = "var(--primary)";
            }
        }, 15000);
    </script>
</body>
</html>
