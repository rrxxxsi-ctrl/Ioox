<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | فخامة الاختيار الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* الثيمات اللونية لكل منتج */
        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.2); }
        body.theme-shahid { --accent-color: #00d982; --glow-color: rgba(0, 217, 130, 0.2); }
        body.theme-chatgpt { --accent-color: #ffffff; --glow-color: rgba(255, 255, 255, 0.15); }
        body.theme-crunchy { --accent-color: #ff6400; --glow-color: rgba(255, 100, 0, 0.2); }
        body.theme-disney { --accent-color: #0063e5; --glow-color: rgba(0, 99, 229, 0.2); }
        body.theme-fasel { --accent-color: #ffc107; --glow-color: rgba(255, 193, 7, 0.2); }
        body.theme-canva { --accent-color: #00c4cc; --glow-color: rgba(0, 196, 204, 0.2); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-base); color: #fff; overflow-x: hidden; transition: var(--transition); }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--glow-color) 0%, transparent 70%);
            z-index: -1; transition: var(--transition);
        }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; text-align: center; }

        header { padding: 40px 0; }
        .logo { font-size: 42px; font-weight: 900; letter-spacing: 6px; color: var(--accent-color); transition: var(--transition); }

        /* شبكة المنتجات */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 40px; }
        .card {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 20px 5px; cursor: pointer; transition: var(--transition);
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.1); box-shadow: 0 10px 25px var(--glow-color); }
        .card i { font-size: 28px; margin-bottom: 8px; color: var(--accent-color); }
        .card h3 { font-size: 12px; font-weight: 700; }

        /* لوحة التفاصيل */
        #checkout {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 30px; margin-bottom: 50px; display: none; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .badge-shared { display: inline-block; background: var(--accent-color); color: #000; padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; margin-bottom: 15px; }

        /* الباقات */
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 20px 0; }
        .plan-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 12px;
            border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .plan-btn.selected { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 700; }
        .plan-btn div { font-size: 10px; opacity: 0.8; }
        .plan-btn strong { font-size: 16px; display: block; margin-top: 3px; }

        .info-panel { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 18px; border-radius: 20px; text-align: right; margin: 20px 0; font-size: 13px; }
        .info-panel ul { padding-right: 18px; color: #ccc; line-height: 1.7; }

        /* معالجة وزنية البنك لمنع خروج الرقم */
        .bank-section {
            background: #000; border: 1px solid var(--glass-border); border-radius: 25px;
            padding: 25px; max-width: 460px; margin: 30px auto 0;
            display: flex; flex-direction: column; align-items: center;
        }
        .bank-row { display: flex; justify-content: space-between; width: 100%; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .iban-container {
            width: 100%; background: rgba(255,255,255,0.02); border: 1px dashed var(--accent-color);
            padding: 15px 5px; border-radius: 12px; margin: 15px 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            overflow: hidden; /* لمنع خروج النص */
        }
        .iban-text { 
            font-family: 'Courier New', monospace; 
            font-size: clamp(10px, 3.8vw, 15px); /* تكبير ذكي يمنع الانهيار */
            color: var(--accent-color); white-space: nowrap;
        }

        .btn-order { width: 100%; background: var(--accent-color); color: #000; border: none; padding: 18px; border-radius: 12px; font-weight: 700; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #000; padding: 10px 25px; border-radius: 50px; display: none; z-index: 2000; font-weight: 700; }
        
        @media (max-width: 500px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
    </style>
</head>
<body class="theme-default">

    <div class="ambient-bg"></div>
    <div class="toast" id="toast">تم نسخ الحساب البنكي ✅</div>

    <div class="container">
        <header>
            <div class="logo">NIKAI</div>
            <p style="opacity: 0.5;">فخامة المحتوى الرقمي 2026</p>
        </header>

        <div class="grid">
            <div class="card" onclick="openService('netflix')">
                <i class="fas fa-film"></i>
                <h3>نتفليكس</h3>
            </div>
            <div class="card" onclick="openService('shahid')">
                <i class="fas fa-play-circle"></i>
                <h3>شاهد VIP</h3>
            </div>
            <div class="card" onclick="openService('chatgpt')">
                <i class="fas fa-robot"></i>
                <h3>ChatGPT</h3>
            </div>
            <div class="card" onclick="openService('crunchy')">
                <i class="fas fa-tv"></i>
                <h3>كرانشي</h3>
            </div>
            <div class="card" onclick="openService('disney')">
                <i class="fas fa-crown"></i>
                <h3>ديزني</h3>
            </div>
            <div class="card" onclick="openService('fasel')">
                <i class="fas fa-bolt"></i>
                <h3>فاصل بلس</h3>
            </div>
            <div class="card" onclick="openService('canva')">
                <i class="fas fa-palette"></i>
                <h3>كانفا برو</h3>
            </div>
        </div>

        <section id="checkout">
            <div class="service-head">
                <h2 id="s-title" style="font-size: 26px; font-weight: 900; margin-bottom: 5px;">الخدمة</h2>
                <div class="badge-shared">حساب مشترك - ملف خاص</div>
            </div>

            <div class="plans-grid" id="s-plans"></div>

            <div class="info-panel">
                <strong><i class="fas fa-check-circle"></i> تفاصيل الاشتراك:</strong>
                <ul id="s-info"></ul>
            </div>

            <div id="email-field" style="display:none; margin-top: 20px;">
                <input type="email" id="u-email" style="width:100%; padding:15px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); color:#fff; text-align:center;" placeholder="أدخل إيميلك الشخصي للتفعيل">
            </div>

            <div class="bank-section">
                <div class="bank-row"><span>البنك:</span><strong>بنك البلاد</strong></div>
                <div class="bank-row"><span>المستفيد:</span><strong>سليمان فلاته</strong></div>
                <div class="iban-container" onclick="copyIBAN()">
                    <span class="iban-text">SA0315000900133520020007</span>
                    <i class="fas fa-copy" style="font-size: 11px; opacity: 0.5;"></i>
                </div>
                <button class="btn-order" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> تأكيد وإرسال الإيصال
                </button>
            </div>
        </section>
    </div>

    <script>
        const services = {
            netflix: {
                name: "نتفليكس بريميوم 4K",
                plans: [{l:"شهر", p:"20 ريال"}, {l:"3 أشهر", p:"75 ريال"}, {l:"6 أشهر", p:"120 ريال"}, {l:"سنة", p:"200 ريال"}],
                info: ["جودة Ultra HD", "ملف خاص بك", "ضمان كامل المدة"],
                email: false
            },
            shahid: {
                name: "شاهد VIP الرياضية",
                plans: [{l:"شهر", p:"20 ريال"}, {l:"3 أشهر", p:"75 ريال"}, {l:"6 أشهر", p:"120 ريال"}, {l:"سنة", p:"200 ريال"}],
                info: ["بث مباريات كأس العالم", "جودة 4K", "لا يشمل أجهزة GOBX"],
                email: false
            },
            chatgpt: {
                name: "ChatGPT Plus (GPT-5)",
                plans: [{l:"شهر", p:"10 ريال"}, {l:"3 أشهر", p:"25 ريال"}, {l:"6 أشهر", p:"50 ريال"}, {l:"سنة", p:"100 ريال"}],
                info: ["نموذج GPT-5 وسرعة فائقة", "ضمان 25 يومًا", "يُمنع تغيير المعلومات"],
                email: false
            },
            crunchy: {
                name: "كرانشي رول بريميوم",
                plans: [{l:"سنة كاملة", p:"50 ريال"}],
                info: ["مشاهدة فورية للأنميات", "جودة 4K وبدون إعلانات", "ضمان سنة"],
                email: false
            },
            fasel: {
                name: "فاصل بلس (ملف خاص)",
                plans: [{l:"شهر", p:"13 ريال"}, {l:"3 أشهر", p:"29 ريال"}, {l:"6 أشهر", p:"49 ريال"}, {l:"سنة", p:"89 ريال"}],
                info: ["بدون إعلانات مزعجة", "أضخم مكتبة أفلام", "تطبيق ذكي"],
                email: false
            },
            disney: {
                name: "ديزني بلس الرسمي",
                plans: [{l:"شهر", p:"20 ريال"}, {l:"6 أشهر", p:"120 ريال"}, {l:"سنة", p:"200 ريال"}],
                info: ["محتوى مارفل وديزني", "ضمان ذهبي"],
                email: false
            },
            canva: {
                name: "كانفا برو",
                plans: [{l:"مدى الحياة", p:"39 ريال"}],
                info: ["تفعيل رسمي على بريدك الشخصي", "قوالب Pro كاملة"],
                email: true
            }
        };

        let selectedPrice = "";
        let selectedLabel = "";

        function openService(id) {
            document.body.className = 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            const s = services[id];
            document.getElementById('checkout').style.display = 'block';
            document.getElementById('s-title').innerText = s.name;
            document.getElementById('s-plans').innerHTML = s.plans.map(p => `
                <div class="plan-btn" onclick="selectPlan(this, '${p.p}', '${p.l}')">
                    <div>${p.l}</div>
                    <strong>${p.p}</strong>
                </div>
            `).join('');
            document.getElementById('s-info').innerHTML = s.info.map(i => `<li>${i}</li>`).join('');
            document.getElementById('email-field').style.display = s.email ? 'block' : 'none';
            const first = document.querySelector('.plan-btn');
            if(first) first.click();
            window.scrollTo({ top: document.getElementById('checkout').offsetTop - 20, behavior: 'smooth' });
        }

        function selectPlan(el, price, label) {
            document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedPrice = price;
            selectedLabel = label;
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function placeOrder() {
            const activeId = document.body.className.replace('theme-', '');
            const s = services[activeId];
            const email = document.getElementById('u-email').value;
            if(s.email && !email) { alert("يرجى كتابة الإيميل"); return; }
            let msg = `مرحباً متجر نيكاي 👋\nأطلب: ${s.name}\nالباقة: ${selectedLabel}\nالسعر: ${selectedPrice}`;
            if(email) msg += `\nالإيميل: ${email}`;
            msg += `\n\nتم التحويل، مرفق الإيصال:`;
            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
