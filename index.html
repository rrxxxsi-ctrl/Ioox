<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP NETFLIX | المتجر الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914;
            --gold: #FFD700;
            --dark: #0a0a0a;
            --accent: #25D366;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark);
            color: white;
            margin: 0;
            transition: 0.5s;
        }

        /* شريط التحميل العلوي */
        #progress-bar {
            position: fixed; top: 0; right: 0; height: 4px; background: var(--primary);
            width: 0%; z-index: 1001; transition: 0.2s;
        }

        /* الواجهة الرئيسية بتأثير سينمائي */
        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=2069&auto=format&fit=crop');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-logo { width: 150px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--primary)); }

        /* نموذج الطلب الذكي */
        .order-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,215,0,0.2);
            max-width: 450px;
            width: 90%;
            margin: -100px auto 50px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-family: 'Cairo';
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-send:hover { background: #b20710; transform: translateY(-3px); }

        /* قسم الضمان */
        .guarantee-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            padding: 20px;
            border-radius: 50px;
            margin: 40px auto;
            max-width: 300px;
            border: 1px solid var(--gold);
        }

        /* زر الطفو للواتساب */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--accent);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div id="progress-bar"></div>

<section class="hero-section">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" class="hero-logo" alt="Netflix">
    <h1 style="font-weight: 900;">اشتراك <span style="color: var(--gold);">VIP</span> السنوي</h1>
    <p>ملف خاص • جودة 4K • ضمان كامل 365 يوم</p>
    <div style="font-size: 2.5rem; font-weight: 900; margin-top: 10px;">200 ريال <span style="font-size: 1rem; color: #888;">/ سنة</span></div>
</section>

<div class="order-container">
    <h3 style="text-align: center; margin-top: 0;">طلب اشتراك سريع ⚡</h3>
    <input type="text" id="cust-name" placeholder="اسمك الكريم">
    <select id="pay-method">
        <option value="التحويل البنكي">التحويل البنكي (الراجحي/الأهلي)</option>
        <option value="STC Pay">STC Pay</option>
        <option value="UrPay">UrPay</option>
    </select>
    <button class="btn-send" onclick="sendToWhatsapp()">إتمام الطلب عبر واتساب</button>
</div>

<div class="guarantee-badge">
    <span style="font-size: 1.5rem; margin-left: 10px;">🛡️</span>
    <div style="text-align: right;">
        <div style="font-weight: bold; color: var(--gold);">الضمان الذهبي</div>
        <div style="font-size: 0.8rem;">تعويض فوري طوال السنة</div>
    </div>
</div>

<div class="whatsapp-float" onclick="window.location.href='https://wa.me/966591388202'">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35" alt="WhatsApp">
</div>

<footer style="text-align: center; padding: 40px; color: #444;">
    <p>متجر المبدعين لخدمات نتفليكس 2026</p>
</footer>

<script>
    // شريط التقدم عند التمرير
    window.onscroll = function() {
        let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        let scrolled = (winScroll / height) * 100;
        document.getElementById("progress-bar").style.width = scrolled + "%";
    };

    // وظيفة إرسال البيانات للواتساب بشكل منظم
    function sendToWhatsapp() {
        const name = document.getElementById('cust-name').value;
        const method = document.getElementById('pay-method').value;
        const number = "966591388202";
        
        if(name === "") { alert("لطفاً أدخل اسمك"); return; }

        const message = `مرحباً، أرغب في طلب اشتراك نتفليكس السنوي (200 ريال)%0A%0A👤 الاسم: ${name}%0A💳 وسيلة الدفع: ${method}%0A🎁 العرض: سنة كاملة 4K`;
        window.location.href = `https://wa.me/${number}?text=${message}`;
    }
</script>

</body>
</html>
