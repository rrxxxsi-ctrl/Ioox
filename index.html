<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>متجر NIKAI | للخدمات الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914; --gold: #D4AF37;
            --bg: #050505; --text: #ffffff; --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1); --nav: rgba(0,0,0,0.8);
        }
        .light-mode {
            --bg: #f5f5f7; --text: #1d1d1f; --card: #ffffff;
            --border: rgba(0, 0, 0, 0.1); --nav: rgba(255,255,255,0.8);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: 0.3s; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--nav); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1001; border-bottom: 1px solid var(--border); }
        .tool-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-size: 0.8rem; }
        .nav-scroll { display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .nav-btn { flex: 0 0 auto; padding: 10px 22px; border-radius: 25px; border: 1px solid var(--border); background: var(--card); color: #777; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .nav-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .container { width: 95%; max-width: 600px; margin: 20px auto 100px auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 25px; padding: 25px; backdrop-filter: blur(10px); width: 100%; text-align: center; }
        .tabs { display: flex; gap: 15px; margin: 15px 0; border-bottom: 1px solid var(--border); justify-content: center; }
        .tab { padding: 8px 15px; cursor: pointer; font-weight: bold; color: #555; }
        .tab.active { color: var(--text); border-bottom: 2px solid var(--primary); }
        .info-list { text-align: right; margin: 15px 0; display: none; }
        .info-list.active { display: block; }
        ul li { margin-bottom: 10px; font-size: 0.9rem; color: #bbb; list-style: none; }
        .price-val { font-size: 4rem; font-weight: 900; margin: 10px 0; }
        .price-val span { font-size: 1.2rem; color: #777; margin: 0 5px; }
        .grid-prices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
        .chip { padding: 12px; border: 1px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; }
        .chip.active { background: var(--text); color: var(--bg); }
        .mail-field-container { width: 100%; margin: 15px 0; display: none; }
        .mail-field-container input { width: 100%; padding: 18px; border-radius: 15px; border: 2px solid var(--gold); background: var(--card); color: var(--text); text-align: center; font-family: 'Cairo'; outline: none; }
        .bank-card { background: rgba(212,175,55,0.05); border: 1px dashed var(--gold); border-radius: 20px; padding: 20px; margin: 15px 0; }
        .action-btn { width: 100%; padding: 20px; border-radius: 20px; border: none; background: var(--text); color: var(--bg); font-size: 1.3rem; font-weight: 900; cursor: pointer; font-family: 'Cairo'; }
    </style>
</head>
<body id="bodyTag">
<div class="toolbar">
    <button class="tool-btn" onclick="toggleLanguage()" id="langBtn">English 🌐</button>
    <div style="font-weight: 900; color: var(--primary);">NIKAI</div>
    <button class="tool-btn" onclick="toggleTheme()" id="themeBtn">☀️/🌙</button>
</div>
<div class="nav-scroll" id="navBar"></div>
<div class="container">
    <div class="card">
        <div id="brandName" style="color: var(--gold); font-weight: 900; font-size: 0.8rem; margin-bottom: 5px;"></div>
        <h1 id="titleDisplay"></h1>
        <div class="tabs">
            <div class="tab active" id="tabM" onclick="setTab('m')"></div>
            <div class="tab" id="tabS" onclick="setTab('s')"></div>
        </div>
        <div id="mList" class="info-list active"><ul></ul></div>
        <div id="sList" class="info-list"><ul></ul></div>
    </div>
    <div class="card">
        <div id="priceGrid" class="grid-prices"></div>
        <div class="price-val" id="priceShow"></div>
        <div class="mail-field-container" id="emailBox">
            <p id="mailLabel" style="color: var(--gold); font-size: 0.8rem; margin-bottom: 10px; font-weight: bold;"></p>
            <input type="email" id="userEmail" placeholder="example@gmail.com">
        </div>
        <div class="bank-card">
            <p style="margin: 0; font-weight: 900;" id="accOwner"></p>
            <p style="color: var(--gold); font-size: 0.75rem; margin: 10px 0;">SA0315000900133520020007</p>
        </div>
        <button class="action-btn" id="mainBtn" onclick="goToChat()"></button>
    </div>
</div>
<script>
    let activeID = 'netflix', currentLang = 'ar', currentTheme = 'dark', activeV = 200, activeN = 'سنة';
    const lang = {
        ar: { brand: "متجر NIKAI – للاشتراكات الرقمية", owner: "المستفيد: سليمان فلاته", m: "المزايا", s: "الشروط", btn: "تأكيد الطلب واتساب ⚡", curr: "ريال", label: "👇 ضع إيميلك الشخصي هنا للتفعيل 👇", wait: "يرجى إدخال البريد الإلكتروني أولاً! 📧", lang: "English 🌐" },
        en: { brand: "NIKAI DIGITAL STORE", owner: "Beneficiary: Suliman Fallatah", m: "Features", s: "Terms", btn: "Confirm Order ⚡", curr: "SAR", label: "👇 Enter your email here 👇", wait: "Please enter your email! 📧", lang: "العربية 🌐" }
    };
    const products = {
        netflix: {
            ar: { h: "نتفلكس بريميوم 4K", m: ["✅ جودة 4K خرافية", "✅ ضمان كامل المدة", "✅ ملف خاص برمز سري"], s: ["📌 جهاز واحد فقط", "⚠️ يمنع تغيير البيانات"] },
            en: { h: "Netflix Premium 4K", m: ["✅ 4K Ultra HD Quality", "✅ Full Warranty", "✅ Private Profile"], s: ["📌 One device only", "⚠️ Do not change data"] },
            p: [{v:75, n:{ar:"3 أشهر", en:"3 Months"}}, {v:120, n:{ar:"6 أشهر", en:"6 Months"}}, {v:200, n:{ar:"سنة", en:"1 Year"}}]
        },
        disney: {
            ar: { h: "ديزني بلس الرسمي", m: ["🌠 عالم ديزني ومارفل", "🇸🇦 دعم كامل للعربية"], s: ["📌 جهاز واحد لك", "⚠️ كود دخول واتساب"] },
            en: { h: "Disney+ Official", m: ["🌠 Disney & Marvel", "🇸🇦 Arabic Support"], s: ["📌 One device only", "⚠️ Login code required"] },
            p: [{v:20, n:{ar:"شهر", en:"1 Month"}}, {v:200, n:{ar:"سنة", en:"1 Year"}}]
        },
        canva: {
            ar: { h: "كانفا برو مدى الحياة", m: ["🖌️ تفعيل على إيميلك", "🖌️ أدوات Pro كاملة"], s: ["📍 تفعيل خلال 12 ساعة"] },
            en: { h: "Canva Pro Lifetime", m: ["🖌️ Active on your email", "🖌️ Full Pro Access"], s: ["📍 Active within 12h"] },
            p: [{v:39, n:{ar:"مدى الحياة", en:"Lifetime"}}]
        },
        fasel: {
            ar: { h: "فاصل بلس (Fasel Plus)", m: ["📺 بدون إعلانات نهائياً", "✅ جودة بث عالية 4K"], s: ["📌 جهاز واحد فقط", "⚠️ يمنع مشاركة الحساب"] },
            en: { h: "Fasel Plus", m: ["📺 No ads forever", "✅ 4K High Quality"], s: ["📌 One device only", "⚠️ No account sharing"] },
            p: [{v:15, n:{ar:"شهر", en:"1 Month"}}, {v:59, n:{ar:"6 شهور", en:"6 Months"}}, {v:98, n:{ar:"سنة", en:"1 Year"}}]
        }
    };
    function renderNav() {
        const nav = document.getElementById('navBar');
        const names = { netflix: {ar:'نتفلكس', en:'Netflix'}, disney:{ar:'ديزني+', en:'Disney+'}, canva:{ar:'كانفا', en:'Canva'}, fasel:{ar:'فاصل بلس', en:'Fasel+'} };
        nav.innerHTML = Object.keys(products).map(key => `<button class="nav-btn ${activeID === key ? 'active' : ''}" onclick="loadP('${key}', this)">${names[key][currentLang]}</button>`).join('');
    }
    function loadP(id, btn) {
        activeID = id; const d = products[id][currentLang]; const p = products[id].p;
        document.getElementById('brandName').innerText = lang[currentLang].brand;
        document.getElementById('titleDisplay').innerText = d.h;
        document.getElementById('mList').innerHTML = `<ul>${d.m.map(i=>`<li>${i}</li>`).join('')}</ul>`;
        document.getElementById('sList').innerHTML = `<ul>${d.s.map(i=>`<li>${i}</li>`).join('')}</ul>`;
        document.getElementById('tabM').innerText = lang[currentLang].m;
        document.getElementById('tabS').innerText = lang[currentLang].s;
        document.getElementById('accOwner').innerText = lang[currentLang].owner;
        document.getElementById('mainBtn').innerText = lang[currentLang].btn;
        document.getElementById('mailLabel').innerText = lang[currentLang].label;
        if(btn) { document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
        const grid = document.getElementById('priceGrid');
        grid.innerHTML = p.map(x => `<div class="chip" onclick="setP(${x.v}, '${x.n[currentLang]}', this)">${x.n[currentLang]}</div>`).join('');
        setP(p[p.length-1].v, p[p.length-1].n[currentLang], grid.lastChild);
        document.getElementById('emailBox').style.display = id === 'canva' ? 'block' : 'none';
        setTab('m');
    }
    function setP(v, n, el) {
        activeV = v; activeN = n; document.getElementById('priceShow').innerHTML = v + `<span> ${lang[currentLang].curr}</span>`;
        if(el) { document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); }
    }
    function setTab(t) {
        document.getElementById('mList').classList.toggle('active', t === 'm');
        document.getElementById('sList').classList.toggle('active', t === 's');
        document.getElementById('tabM').classList.toggle('active', t === 'm');
        document.getElementById('tabS').classList.toggle('active', t === 's');
    }
    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const h = document.getElementById('htmlTag'); h.dir = currentLang === 'ar' ? 'rtl' : 'ltr'; h.lang = currentLang;
        document.getElementById('langBtn').innerText = lang[currentLang].lang;
        renderNav(); loadP(activeID);
    }
    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.getElementById('bodyTag').classList.toggle('light-mode');
    }
    function goToChat() {
        const e = document.getElementById('userEmail').value;
        if(activeID === 'canva' && !e) return alert(lang[currentLang].wait);
        let m = currentLang === 'ar' ? `مرحباً سليمان 👋 أطلب اشتراك ${products[activeID].ar.h} - باقة ${activeN} بسعر ${activeV} ريال` : `Hello 👋 I want to order ${products[activeID].en.h} - Plan ${activeN} for ${activeV} SAR`;
        if(e) m += ` - Email: ${e}`;
        window.location.href = `https://wa.me/966591388202?text=${encodeURIComponent(m)}`;
    }
    window.onload = () => { renderNav(); loadP('netflix'); };
</script>
</body>
</html>
