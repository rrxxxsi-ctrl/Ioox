<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>متجر NIKAI | الإصلاح النهائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914; --gold: #D4AF37;
            --bg: #050505; --text: #ffffff; --card: #141414;
            --border: rgba(255, 255, 255, 0.1);
        }
        .light-mode { --bg: #f5f5f7; --text: #1d1d1f; --card: #ffffff; --border: rgba(0, 0, 0, 0.1); }

        body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; transition: 0.3s; }
        .toolbar { display: flex; justify-content: space-between; padding: 10px 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .nav-scroll { display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none; }
        .nav-btn { flex: 0 0 auto; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: #777; cursor: pointer; font-weight: bold; }
        .nav-btn.active { border-color: var(--text); color: var(--text); background: rgba(255,255,255,0.1); }

        .container { width: 95%; max-width: 600px; margin: 20px auto; padding-bottom: 50px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 25px; padding: 25px; margin-bottom: 20px; }
        
        /* تفعيل ظهور الإيميل بشكل دائم عند الحاجة */
        #emailContainer { margin-top: 20px; margin-bottom: 20px; }
        .input-style {
            width: 100%; padding: 18px; border-radius: 15px; border: 2px solid var(--gold); 
            background: rgba(0,0,0,0.2); color: var(--text); text-align: center;
            font-size: 1rem; font-family: 'Cairo'; display: block;
        }

        .price-big { font-size: 4.5rem; font-weight: 900; text-align: center; margin: 10px 0; }
        .bank-info { background: rgba(212,175,55,0.05); border: 1px dashed var(--gold); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .order-btn { width: 100%; padding: 22px; border-radius: 20px; border: none; background: #fff; color: #000; font-weight: 900; font-size: 1.4rem; cursor: pointer; }
    </style>
</head>
<body id="bodyTag">

<div class="toolbar">
    <button onclick="toggleLang()" style="background:none; border:none; color:var(--text); cursor:pointer;">EN/عربي 🌐</button>
    <div style="font-weight: 900; color:var(--primary)">NIKAI</div>
    <button onclick="toggleTheme()" style="background:none; border:none; color:var(--text); cursor:pointer;">☀️/🌙</button>
</div>

<div class="nav-scroll">
    <button class="nav-btn" id="btn-netflix" onclick="loadP('netflix')">Netflix</button>
    <button class="nav-btn" id="btn-disney" onclick="loadP('disney')">Disney+</button>
    <button class="nav-btn" id="btn-canva" onclick="loadP('canva')">Canva Pro</button>
</div>

<div class="container">
    <div class="card">
        <h1 id="pTitle" style="text-align: center;">جاري التحميل...</h1>
        <div id="pFeatures" style="font-size: 0.9rem; color: #aaa;"></div>
    </div>

    <div class="card">
        <div class="price-big" id="pPrice">0<span> ريال</span></div>

        <div id="emailSection" style="display: none;">
            <p style="text-align: center; font-size: 0.85rem; color: var(--gold); margin-bottom: 10px;">👇 ضع إيميلك الشخصي هنا للتفعيل فوراً 👇</p>
            <input type="email" id="emailInput" class="input-style" placeholder="example@gmail.com">
        </div>

        <div class="bank-info">
            <p style="margin:0; font-weight: 900;">المستفيد: سليمان فلاته</p>
            <p style="color:var(--gold); font-size: 0.8rem;">SA0315000900133520020007</p>
        </div>

        <button class="order-btn" onclick="sendOrder()">تأكيد الطلب واتساب ⚡</button>
    </div>
</div>

<script>
    const products = {
        netflix: { t: "نتفلكس بريميوم 4K", p: 200, f: "✅ جودة 4K | ✅ ضمان كامل", mail: false },
        disney: { t: "ديزني بلس الرسمي", p: 200, f: "🌠 عوالم ديزني ومارفل", mail: false },
        canva: { t: "كانفا برو مدى الحياة", p: 39, f: "🖌️ تفعيل على إيميلك الشخصي", mail: true }
    };

    let activeP = 'netflix';

    function loadP(id) {
        activeP = id;
        const d = products[id];
        document.getElementById('pTitle').innerText = d.t;
        document.getElementById('pPrice').innerHTML = d.p + '<span> ريال</span>';
        document.getElementById('pFeatures').innerText = d.f;
        
        // إظهار أو إخفاء خانة الإيميل
        document.getElementById('emailSection').style.display = d.mail ? 'block' : 'none';
        
        // تحديث ألوان الأزرار
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + id).classList.add('active');
    }

    function sendOrder() {
        const email = document.getElementById('emailInput').value;
        // التحقق من الإيميل فقط إذا كان المنتج هو كانفا
        if(products[activeP].mail && !email) {
            alert("يا غالي، يرجى كتابة إيميلك في الخانة المخصصة أولاً! 📧");
            return;
        }

        let msg = `طلب ${products[activeP].t}%0Aالسعر: ${products[activeP].p} ريال`;
        if(email) msg += `%0Aالإيميل: ${email}`;
        window.location.href = `https://wa.me/966591388202?text=${msg}`;
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function toggleLang() { alert("ميزة الترجمة ستتوفر قريباً!"); }

    window.onload = () => loadP('canva'); // افتح كانفا افتراضياً للتجربة
</script>
</body>
</html>
