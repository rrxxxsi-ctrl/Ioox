<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | المتجر الرقمي الأفخم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* السمات الخاصة بكل منتج */
        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.15); }
        body.theme-disney { --accent-color: #0063e5; --glow-color: rgba(0, 99, 229, 0.15); }
        body.theme-canva { --accent-color: #00c4cc; --glow-color: rgba(0, 196, 204, 0.15); }
        body.theme-fasel { --accent-color: #ffc107; --glow-color: rgba(255, 193, 7, 0.15); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-base);
            color: #fff;
            line-height: 1.6;
            overflow-x: hidden;
            transition: var(--transition);
        }

        /* تأثير الإضاءة الخلفية المتغيرة */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--glow-color) 0%, transparent 70%);
            z-index: -1;
            transition: var(--transition);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        /* Header */
        header { padding: 30px 0; text-align: center; }
        .logo { font-size: 40px; font-weight: 900; letter-spacing: 5px; color: var(--accent-color); transition: var(--transition); }

        /* Products Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.05); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.08); box-shadow: 0 10px 30px var(--glow-color); }

        .card i { font-size: 40px; margin-bottom: 15px; color: var(--accent-color); transition: var(--transition); }
        .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .card .price { font-size: 24px; font-weight: 900; opacity: 0.9; }

        /* Checkout Section */
        #checkout {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            margin-bottom: 60px;
            display: none;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .service-info { text-align: center; margin-bottom: 30px; }
        .service-info h2 { font-size: 32px; margin-bottom: 10px; color: var(--accent-color); }

        .features {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 30px;
        }

        .feature-tag {
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 8px;
        }

        .feature-tag i { color: var(--accent-color); }

        /* Bank UI - Fixed Alignment */
        .bank-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto; /* هذا يضمن التوسط */
            text-align: center; /* توطين النصوص بالداخل */
        }

        .bank-details { margin-bottom: 20px; }
        .bank-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .bank-row span { color: #888; font-size: 14px; }
        .bank-row strong { font-size: 15px; }

        .iban-box {
            background: #000;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 17px;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            margin: 20px 0;
            cursor: pointer;
            transition: 0.3s;
        }

        .iban-box:hover { background: rgba(255,255,255,0.05); }

        .input-field {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            margin-bottom: 20px;
            font-family: 'Cairo';
            text-align: center;
        }

        .btn-order {
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: var(--transition);
        }

        .btn-order:hover { filter: brightness(1.2); transform: scale(1.02); }

        footer { text-align: center; padding: 40px; opacity: 0.4; font-size: 12px; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent-color); color: white; padding: 10px 30px;
            border-radius: 50px; font-weight: 700; display: none; z-index: 1000;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
            #checkout { padding: 20px; }
        }
    </style>
</head>
<body class="theme-default">

    <div class="ambient-bg"></div>
    <div class="toast" id="toast">تم النسخ!</div>

    <div class="container">
        <header>
            <div class="logo">NIKAI</div>
            <p style="opacity: 0.6; margin-top: 10px;">الاشتراكات الأكثر أماناً في المملكة</p>
        </header>

        <div class="grid">
            <div class="card" onclick="updateTheme('netflix')">
                <i class="fas fa-film"></i>
                <h3>نتفليكس</h3>
                <div class="price">200 ريال</div>
            </div>
            <div class="card" onclick="updateTheme('disney')">
                <i class="fas fa-crown"></i>
                <h3>ديزني بلس</h3>
                <div class="price">200 ريال</div>
            </div>
            <div class="card" onclick="updateTheme('canva')">
                <i class="fas fa-palette"></i>
                <h3>كانفا برو</h3>
                <div class="price">39 ريال</div>
            </div>
            <div class="card" onclick="updateTheme('fasel')">
                <i class="fas fa-play"></i>
                <h3>فاصل بلس</h3>
                <div class="price">98 ريال</div>
            </div>
        </div>

        <section id="checkout">
            <div class="service-info">
                <h2 id="s-name">الخدمة</h2>
                <p id="s-price">00 ريال</p>
            </div>

            <div class="features" id="s-features"></div>

            <div id="email-area" style="display:none;">
                <input type="email" id="u-email" class="input-field" placeholder="أدخل إيميلك الشخصي للتفعيل">
            </div>

            <div class="bank-card">
                <div class="bank-details">
                    <div class="bank-row"><span>البنك</span><strong>بنك البلاد</strong></div>
                    <div class="bank-row"><span>المستفيد</span><strong>سليمان فلاته</strong></div>
                </div>
                <div class="iban-box" onclick="copyIBAN()">SA0315000900133520020007</div>
                <p style="font-size: 11px; opacity: 0.5; margin-bottom: 20px;">انقر على الآيبان للنسخ</p>
                
                <button class="btn-order" onclick="sendOrder()">
                    <i class="fab fa-whatsapp"></i> تأكيد الطلب وإرسال الإيصال
                </button>
            </div>
        </section>

        <footer>
            جميع الحقوق محفوظة لمتجر NIKAI 2026 | دعم فني: 0591388202
        </footer>
    </div>

    <script>
        const services = {
            netflix: {
                name: "نتفليكس بريميوم 4K",
                price: "200 ريال",
                features: ["ملف خاص بك", "شاشة واحدة", "جودة Ultra HD", "ضمان كامل"],
                email: false
            },
            disney: {
                name: "ديزني بلس الرسمي",
                price: "200 ريال",
                features: ["ملف خاص", "محتوى مارفل", "ترجمة عربية", "بدون إعلانات"],
                email: false
            },
            canva: {
                name: "كانفا برو مدى الحياة",
                price: "39 ريال",
                features: ["تفعيل على إيميلك", "كامل المميزات", "قوالب حصرية", "دعم فني"],
                email: true
            },
            fasel: {
                name: "فاصل بلس",
                price: "98 ريال",
                features: ["أعلى جودة", "بدون إعلانات", "تطبيق ذكي", "تحديث يومي"],
                email: false
            }
        };

        function updateTheme(id) {
            // تغيير ثيم الصفحة بالكامل
            document.body.className = 'theme-' + id;
            
            // تحديث الكروت النشطة
            document.querySelectorAll('.card').forEach((c, idx) => {
                c.classList.remove('active');
                if(Object.keys(services)[idx] === id) c.classList.add('active');
            });

            // عرض لوحة الدفع
            const s = services[id];
            document.getElementById('checkout').style.display = 'block';
            document.getElementById('s-name').innerText = s.name;
            document.getElementById('s-price').innerText = s.price;
            
            // المزايا
            document.getElementById('s-features').innerHTML = s.features.map(f => `
                <div class="feature-tag"><i class="fas fa-check"></i> ${f}</div>
            `).join('');

            // قسم الإيميل
            document.getElementById('email-area').style.display = s.email ? 'block' : 'none';
            
            window.scrollTo({ top: document.getElementById('checkout').offsetTop - 50, behavior: 'smooth' });
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function sendOrder() {
            const activeId = document.body.className.replace('theme-', '');
            const s = services[activeId];
            const email = document.getElementById('u-email').value;
            
            if(s.email && !email) {
                alert("يرجى كتابة الإيميل");
                return;
            }

            let msg = `مرحباً نيكاي 👋\nأرغب في اشتراك: ${s.name}\nالسعر: ${s.price}`;
            if(email) msg += `\nالإيميل: ${email}`;
            msg += `\n\nقمت بالتحويل وسأرفق الإيصال الآن.`;

            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
