<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP NETFLIX | هويتنا التميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #E50914;
            --g: linear-gradient(135deg, #E50914 0%, #ff5e62 100%);
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            background: #050505; color: #fff;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* الإضاءة الخلفية الهولوجرافية */
        .glow-sphere {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.15) 0%, transparent 70%);
            border-radius: 50%; z-index: -1; filter: blur(60px);
            pointer-events: none; transition: 0.1s;
        }

        /* الحاوية المتطورة */
        .app-shell {
            max-width: 1200px; margin: 0 auto; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* البطاقة الرئيسية الغامرة */
        .main-stage {
            width: 100%; min-height: 600px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            display: grid; grid-template-columns: 1.2fr 1fr;
            overflow: hidden; position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .info-side { padding: 60px; display: flex; flex-direction: column; justify-content: center; }
        .visual-side { 
            background: url('https://images.unsplash.com/photo-1616530940355-351fabd9524b?q=80&w=1935') center/cover;
            position: relative; overflow: hidden;
        }
        .visual-side::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(5,5,5,1) 0%, transparent 40%);
        }

        /* النصوص */
        .typewriter { font-size: 1.1rem; color: var(--p); letter-spacing: 5px; font-weight: 600; margin-bottom: 10px; }
        h1 { font-size: 4.5rem; margin: 0; font-weight: 900; line-height: 1; }
        .price-tag { font-size: 5rem; font-weight: 300; margin: 20px 0; color: #fff; }

        /* الأزرار والمميزات */
        .features-row { display: flex; gap: 20px; margin-top: 30px; }
        .f-pill { 
            background: rgba(255,255,255,0.05); padding: 10px 20px; 
            border-radius: 100px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1);
        }

        .order-btn-ultra {
            background: var(--g); color: #fff; text-decoration: none;
            padding: 25px 60px; border-radius: 100px; font-weight: 900;
            font-size: 1.5rem; margin-top: 50px; display: inline-block;
            box-shadow: 0 20px 40px rgba(229, 9, 20, 0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .order-btn-ultra:hover { transform: scale(1.05) translateY(-5px); box-shadow: 0 30px 60px rgba(229, 9, 20, 0.5); }

        /* لايف بار */
        .live-bar {
            position: fixed; bottom: 30px; right: 30px; 
            background: #fff; color: #000; padding: 12px 25px;
            border-radius: 100px; display: flex; align-items: center; gap: 10px;
            font-weight: bold; font-size: 0.9rem; z-index: 1000;
        }
        .dot-live { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        @media (max-width: 900px) {
            .main-stage { grid-template-columns: 1fr; border-radius: 30px; }
            .visual-side { height: 250px; order: -1; }
            .info-side { padding: 40px 25px; text-align: center; }
            h1 { font-size: 2.8rem; }
            .price-tag { font-size: 3.5rem; }
            .features-row { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="glow-sphere" id="sphere"></div>

    <div class="app-shell">
        <nav style="width: 100%; display: flex; justify-content: space-between; margin-bottom: 50px;">
            <div style="font-weight: 900; font-size: 1.5rem;">NETFLIX <span style="color:var(--p)">VIP</span></div>
            <div style="color: #666; font-size: 0.8rem;">EDITION 2026</div>
        </nav>

        <div class="main-stage">
            <div class="info-side">
                <div class="typewriter">PLATINUM QUALITY</div>
                <h1>سينما<br>في ملفك الخاص</h1>
                <div class="price-tag">200 <span style="font-size: 1.5rem; color: #444;">SAR / سنة</span></div>
                
                <p style="color: #888; font-size: 1.1rem; max-width: 450px;">
                    لا تساوم على الجودة. احصل على حسابك الشخصي المستقل بدقة 4K فائقة الوضوح مع ضمان ذهبي شامل.
                </p>

                <div class="features-row">
                    <div class="f-pill">🛡️ ضمان ذهبي</div>
                    <div class="f-pill">🎬 Ultra HD 4K</div>
                    <div class="f-pill">🔒 ملف خاص</div>
                </div>

                <a href="https://wa.me/966591388202" class="order-btn-ultra">ابدأ المشاهدة الآن</a>
            </div>
            
            <div class="visual-side"></div>
        </div>
    </div>

    <div class="live-bar">
        <div class="dot-live"></div>
        <span>18 شخص يشاهدون العرض الآن</span>
    </div>

    <script>
        // تأثير تتبع الماوس للإضاءة
        const sphere = document.getElementById('sphere');
        document.addEventListener('mousemove', (e) => {
            sphere.style.left = e.clientX - 300 + 'px';
            sphere.style.top = e.clientY - 300 + 'px';
        });

        // تغيير عدد المشاهدين بشكل عشوائي للواقعية
        setInterval(() => {
            const viewers = Math.floor(Math.random() * (25 - 12 + 1)) + 12;
            document.querySelector('.live-bar span').innerText = `${viewers} شخص يشاهدون العرض الآن`;
        }, 8000);
    </script>
</body>
</html>
