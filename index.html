<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر NIKAI | اشتراكات رقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914; --disney: #0063e5; --canva: #7d2ae8; --fasel: #00bcd4; --chatgpt: #10a37f;
            --gold: #D4AF37; --bg: #050505; --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: #fff;
            font-family: 'Cairo', sans-serif; direction: rtl;
        }
        /* شريط المنتجات */
        .nav-container {
            display: flex; gap: 10px; padding: 15px; overflow-x: auto;
            background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: #fff; cursor: pointer;
            white-space: nowrap; font-weight: bold; font-family: 'Cairo';
        }
        .nav-btn.active { border-color: var(--primary); background: rgba(229, 9, 20, 0.2); color: var(--primary); }

        .main-content { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        
        /* التبويبات */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
        .tab { padding: 10px; cursor: pointer; color: #777; font-weight: bold; }
        .tab.active { color: #fff; border-bottom: 2px solid #fff; }
        .tab-content { display: none; padding-top: 10px; }
        .tab-content.active { display: block; }
        ul { padding: 0; list-style: none; }
        li { margin-bottom: 10px; font-size: 0.95rem; color: #ccc; }

        /* الأسعار */
        .price-display { text-align: center; font-size: 3.5rem; font-weight: 900; margin: 15px 0; }
        .price-display span { font-size: 1.2rem; color: #666; }
        .selectors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .chip { padding: 12px; border: 1px solid var(--border); border-radius: 12px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); }
        .chip.active { background: #fff; color: #000; font-weight: bold; }

        /* البنك والطلب */
        .bank-box { background: rgba(212,175,55,0.05); border: 1px dashed var(--gold); border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .cta-btn {
            width: 100%; padding: 20px; border-radius: 15px; border: none;
            background: #fff; color: #000; font-size: 1.3rem; font-weight: 900;
            cursor: pointer; font-family: 'Cairo'; transition: 0.3s;
        }
        .email-input { width: 100%; padding: 15px; border-radius: 12px; background: #111; border: 1px solid var(--border); color: #fff; margin-bottom: 15px; display: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="nav-container">
    <button class="nav-btn active" onclick="changeP('netflix', this)">نتفلكس</button>
    <button class="nav-btn" onclick="changeP('disney', this)">ديزني+</button>
    <button class="nav-btn" onclick="changeP('canva', this)">كانفا برو</button>
    <button class="nav-btn" onclick="changeP('fasel', this)">فاصل بلس</button>
    <button class="nav-btn" onclick="changeP('chatgpt', this)">ChatGPT</button>
</div>

<div class="main-content">
    <h2 id="title" style="text-align: center;">نتفلكس بريميوم 4K</h2>

    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="showTab('m', this)">المزايا</div>
            <div class="tab" onclick="showTab('s', this)">الشروط</div>
        </div>
        <div id="m" class="tab-content active"><ul id="m-list"></ul></div>
        <div id="s" class="tab-content"><ul id="s-list"></ul></div>
    </div>

    <div class="card">
        <p style="text-align: center; color: #777;">حدد المدة</p>
        <div class="selectors" id="price-selectors"></div>
        <div class="price-display"><span id="price-val">200</span><span> ريال</span></div>
        
        <input type="email" id="email" class="email-input" placeholder="أدخل إيميلك الشخصي">

        <div class="bank-box">
            <p style="margin: 0; font-weight: bold;">المستفيد: سليمان فلاته</p>
            <p style="color: var(--gold); font-size: 0.8rem; margin: 5px 0;">SA0315000900133520020007</p>
            <small style="cursor: pointer; color: #999;" onclick="copyI()">📋 نسخ الآيبان</small>
        </div>
        <button class="cta-btn" onclick="order()">تأكيد الطلب واتساب ⚡</button>
    </div>
</div>

<script>
    const data = {
        netflix: {
            name: "نتفلكس بريميوم 4K",
            m: ["✅ جودة خرافية 4K ULTRA HD", "✅ اشتراك سنة كاملة (12 شهر)", "✅ ملف خاص برقم سري", "✅ ضمان ذهبي طوال المدة"],
            s: ["📌 جهاز واحد فقط للمشاهدة", "⚠️ يمنع تغيير كلمة المرور", "✅ يسمح بتغيير اسم الملف"],
            prices: [{n:"3 أشهر", v:75}, {n:"6 أشهر", v:120}, {n:"سنة كاملة", v:200}]
        },
        disney: {
            name: "ديزني بلس",
            m: ["🌠 عوالم ديزني و مارفل", "🇸🇦 دعم كامل للغة العربية", "✅ ضمان كامل المدة"],
            s: ["📌 جهاز واحد فقط", "⚠️ يمنع تغيير بيانات الحساب"],
            prices: [{n:"3 أشهر", v:75}, {n:"6 أشهر", v:120}, {n:"سنة", v:200}]
        },
        canva: {
            name: "كانفا برو مدى الحياة",
            m: ["🖌️ اشتراك على إيميلك الشخصي", "🖌️ وصول لكافة أدوات التصميم Pro", "✅ ضمان لمدة سنة"],
            s: ["📍 التفعيل خلال 1-12 ساعة"],
            prices: [{n:"مدى الحياة", v:39}]
        },
        fasel: {
            name: "فاصل بلس",
            m: ["📺 بدون إعلانات", "✅ جودة عالية 4K", "⚡ تفعيل فوري"],
            s: ["📌 جهاز واحد فقط"],
            prices: [{n:"شهر", v:15}, {n:"6 أشهر", v:59}, {n:"سنة", v:98}]
        },
        chatgpt: {
            name: "ChatGPT Plus",
            m: ["🤖 الوصول لنسخة GPT-5", "⚡ استجابة سريعة جداً"],
            s: ["🔴 الحساب مشترك", "⚠️ كود دخول واتساب"],
            prices: [{n:"شهر", v:20}, {n:"3 أشهر", v:75}, {n:"سنة", v:200}]
        }
    };

    let currentP = 'netflix', currentV = 200, currentN = "سنة كاملة";

    function changeP(p, btn) {
        currentP = p;
        const d = data[p];
        document.getElementById('title').innerText = d.name;
        
        // تحديث الأزرار العلوية
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // تحديث المزايا والشروط
        document.getElementById('m-list').innerHTML = d.m.map(i => `<li>${i}</li>`).join('');
        document.getElementById('s-list').innerHTML = d.s.map(i => `<li>${i}</li>`).join('');

        // تحديث الأسعار
        const pSel = document.getElementById('price-selectors');
        pSel.innerHTML = d.prices.map(x => `<div class="chip" onclick="setV(${x.v}, '${x.n}', this)">${x.n}</div>`).join('');
        
        // اختيار آخر سعر تلقائياً
        const lastPrice = d.prices[d.prices.length-1];
        setV(lastPrice.v, lastPrice.n, pSel.lastChild);

        // إظهار حقل الإيميل لكانفا فقط
        document.getElementById('email').style.display = (p === 'canva') ? 'block' : 'none';
        
        showTab('m', document.querySelector('.tab')); // العودة لتبويب المزايا
    }

    function setV(v, n, el) {
        currentV = v; currentN = n;
        document.getElementById('price-val').innerText = v;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        if(el) el.classList.add('active');
    }

    function showTab(id, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function copyI() {
        navigator.clipboard.writeText("SA0315000900133520020007");
        alert("تم نسخ الآيبان ✅");
    }

    function order() {
        const e = document.getElementById('email').value;
        if(currentP === 'canva' && !e) return alert("أدخل الإيميل أولاً");
        let msg = `طلب ${data[currentP].name}%0Aالباقة: ${currentN}%0Aالسعر: ${currentV} ريال`;
        if(e) msg += `%0Aالإيميل: ${e}`;
        msg += `%0A--%0Aالمستفيد: سليمان فلاته ✅`;
        window.location.href = `https://wa.me/966591388202?text=${msg}`;
    }

    // التشغيل الأول
    window.onload = () => changeP('netflix', document.querySelector('.nav-btn'));
</script>

</body>
</html>
