<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>متجر NIKAI | للخدمات الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E50914; --gold: #D4AF37;
            --bg: #050505; --text: #ffffff; --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1); --nav: rgba(0,0,0,0.8);
        }
        .light-mode {
            --bg: #f5f5f7; --text: #1d1d1f; --card: #ffffff;
            --border: rgba(0, 0, 0, 0.1); --nav: rgba(255,255,255,0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; overflow-x: hidden; min-height: 100vh; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--nav); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1001; border-bottom: 1px solid var(--border); }
        .tool-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-size: 0.8rem; }

        .nav-scroll { display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .nav-btn { flex: 0 0 auto; padding: 10px 22px; border-radius: 25px; border: 1px solid var(--border); background: var(--card); color: #777; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
        .nav-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

        .container { width: 95%; max-width: 600px; margin: 20px auto 100px auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 25px; padding: 25px; backdrop-filter: blur(10px); width: 100%; text-align: center; }
        
        .price-val { font-size: 4.5rem; font-weight: 900; margin: 15px 0; }
        .price-val span { font-size: 1.2rem; color: #777; margin: 0 5px; }

        .mail-field-container { width: 100%; margin: 15px 0; display: none; text-align: center; }
        .mail-field-container.visible { display: block; }
        .mail-field-container input { 
            width: 100%; padding: 18px; border-radius: 15px; border: 2px solid var(--gold); 
            background: var(--card); color: var(--text); text-align: center; font-family: 'Cairo';
            display: block; margin: 0 auto; outline: none;
        }

        .bank-card { background: rgba(212,175,55,0.05); border: 1px dashed var(--gold); border-radius: 20px; padding: 20px; margin: 20px 0; }
        .action-btn { width: 100%; padding: 20px; border-radius: 20px; border: none; background: var(--text); color: var(--bg); font-size: 1.3rem; font-weight: 900; cursor: pointer; font-family: 'Cairo'; }

        /* تعديلات الاتجاه عند الإنجليزية */
        [dir="ltr"] .toolbar, [dir="ltr"] .nav-scroll { flex-direction: row; }
    </style>
</head>
<body id="bodyTag">

<div class="toolbar">
    <button class="tool-btn" onclick="toggleLanguage()" id="langBtn">English 🌐</button>
    <div style="font-weight: 900; font-size: 1.1rem; color: var(--primary);">NIKAI</div>
    <button class="tool-btn" onclick="toggleTheme()" id="themeBtn">☀️/🌙</button>
</div>

<div class="nav-scroll" id="navBar"></div>

<div class="container">
    <div class="card">
        <div id="brandName" style="color: var(--gold); font-weight: 900; font-size: 0.8rem; margin-bottom: 5px;"></div>
        <h1 id="titleDisplay"></h1>
    </div>

    <div class="card">
        <div class="price-val" id="priceShow"></div>
        
        <div class="mail-field-container" id="emailContainer">
            <p id="mailLabel" style="color: var(--gold); font-size: 0.8rem; margin-bottom: 10px; font-weight: bold;"></p>
            <input type="email" id="userEmail" placeholder="example@gmail.com">
        </div>

        <div class="bank-card">
            <p style="margin: 0; font-weight: 900;" id="accOwner"></p>
            <p style="color: var(--gold); font-size: 0.75rem; margin: 10px 0;">SA0315000900133520020007</p>
        </div>
        
        <button class="action-btn" id="mainBtn" onclick="goToChat()"></button>
    </div>
</div>

<script>
    let activeID = 'netflix';
    let currentLang = 'ar';
    let currentTheme = 'dark';

    const langData = {
        ar: {
            brand: "متجر NIKAI – للاشتراكات الرقمية",
            accOwner: "المستفيد: سليمان فلاته",
            mailLabel: "👇 ضع إيميلك الشخصي هنا للتفعيل 👇",
            btnOrder: "تأكيد الطلب واتساب ⚡",
            curr: "ريال",
            wait: "يرجى إدخال البريد الإلكتروني أولاً! 📧",
            prods: {
                netflix: "نتفلكس بريميوم 4K",
                disney: "ديزني بلس الرسمي",
                canva: "كانفا برو مدى الحياة"
            }
        },
        en: {
            brand: "NIKAI DIGITAL STORE",
            accOwner: "Beneficiary: Suliman Fallatah",
            mailLabel: "👇 Enter your email here for activation 👇",
            btnOrder: "Confirm via WhatsApp ⚡",
            curr: "SAR",
            wait: "Please enter your email first! 📧",
            prods: {
                netflix: "Netflix Premium 4K",
                disney: "Disney+ Official",
                canva: "Canva Pro Lifetime"
            }
        }
    };

    const products = {
        netflix: { p: 200, mail: false },
        disney: { p: 200, mail: false },
        canva: { p: 39, mail: true }
    };

    function renderNav() {
        const nav = document.getElementById('navBar');
        nav.innerHTML = Object.keys(products).map(key => `
            <button class="nav-btn ${activeID === key ? 'active' : ''}" onclick="loadP('${key}', this)">
                ${langData[currentLang].prods[key]}
            </button>
        `).join('');
    }

    function loadP(id, btn) {
        activeID = id;
        const pData = products[id];
        const tData = langData[currentLang];
        
        document.getElementById('brandName').innerText = tData.brand;
        document.getElementById('titleDisplay').innerText = tData.prods[id];
        document.getElementById('priceShow').innerHTML = pData.p + `<span> ${tData.curr}</span>`;
        document.getElementById('accOwner').innerText = tData.accOwner;
        document.getElementById('mailLabel').innerText = tData.mailLabel;
        document.getElementById('mainBtn').innerText = tData.btnOrder;

        if(btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const emailBox = document.getElementById('emailContainer');
        emailBox.style.display = pData.mail ? 'block' : 'none';
    }

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('htmlTag');
        html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        html.lang = currentLang;
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English 🌐' : 'العربية 🌐';
        renderNav();
        loadP(activeID);
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.getElementById('bodyTag').classList.toggle('light-mode');
    }

    function goToChat() {
        const email = document.getElementById('userEmail').value;
        if(products[activeID].mail && !email) return alert(langData[currentLang].wait);
        
        let msg = currentLang === 'ar' 
            ? `مرحباً سليمان 👋 أطلب ${langData.ar.prods[activeID]} بسعر ${products[activeID].p} ريال`
            : `Hello Suliman 👋 I want to order ${langData.en.prods[activeID]} for ${products[activeID].p} SAR`;
            
        if(email) msg += ` - Email: ${email}`;
        window.location.href = `https://wa.me/966591388202?text=${encodeURIComponent(msg)}`;
    }

    window.onload = () => { renderNav(); loadP('netflix'); };
</script>
</body>
</html>
