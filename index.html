<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIKAI | فخامة الاشتراكات الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #020205;
            --text-main: #ffffff;
            --accent-color: #ffffff;
            --glow: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 20px 40px rgba(0,0,0,0.6);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* تحسين جذري للوضع النهاري الكريستالي */
        body.light-mode {
            --bg-base: #f1f4f9;
            --text-main: #1a1c20;
            --accent-color: #2d3436;
            --glass: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --card-shadow: 12px 12px 25px #d1d9e6, -12px -12px 25px #ffffff;
            --glow: rgba(0, 0, 0, 0.02);
        }

        /* الهويات اللونية المتطورة */
        body.theme-crunchy { --accent-color: #ff6400; --glow: rgba(255, 100, 0, 0.3); } 
        body.theme-fasel { --accent-color: #ffc107; --glow: rgba(255, 193, 7, 0.3); }
        body.theme-osn { --accent-color: #ff007f; --glow: rgba(255, 0, 127, 0.3); } 
        body.theme-canva { --accent-color: #00c4cc; --glow: rgba(0, 196, 204, 0.3); }
        body.theme-windows { --accent-color: #00a884; --glow: rgba(0, 168, 132, 0.3); } 

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: background 0.8s ease, color 0.5s ease; }

        /* الخلفية التفاعلية الحية */
        .aura { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at var(--mx, 50%) var(--my, 20%), var(--glow) 0%, transparent 65%); z-index: -1; pointer-events: none; transition: 0.8s ease; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* شريط التحكم السحابي */
        .top-nav { position: fixed; top: 25px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .nav-pill { display: flex; gap: 10px; background: var(--glass); backdrop-filter: blur(30px); padding: 8px; border-radius: 60px; border: 1px solid var(--glass-border); box-shadow: var(--card-shadow); }
        .btn-icon { width: 46px; height: 46px; border-radius: 50%; border: none; background: rgba(255,255,255,0.05); color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.4s; }
        .btn-icon:hover { background: var(--accent-color); color: #fff; transform: scale(1.15) rotate(8deg); }

        header { padding: 110px 0 40px; text-align: center; }
        .logo { font-size: 58px; font-weight: 900; letter-spacing: 14px; color: var(--text-main); text-shadow: 0 0 25px var(--glow); }

        /* شبكة المنتجات الاحترافية (3 أعمدة) */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 50px; animation: fadeInUp 0.8s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 28px; padding: 35px 10px; cursor: pointer; transition: var(--transition); backdrop-filter: blur(15px); display: flex; flex-direction: column; align-items: center; box-shadow: var(--card-shadow); }
        .card:hover { transform: translateY(-12px) scale(1.05); border-color: var(--accent-color); box-shadow: 0 25px 50px var(--glow); }
        .card.active { border-color: var(--accent-color); background: rgba(128,128,128,0.15); transform: scale(1.05); }
        .card i { font-size: 38px; margin-bottom: 18px; color: var(--accent-color); transition: 0.4s; }
        .card h3 { font-size: 12px; font-weight: 900; text-align: center; }

        /* واجهة الطلب السينمائية */
        #checkout { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 45px; padding: 45px 25px; margin-bottom: 70px; display: none; animation: slideIn 0.7s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(50px); box-shadow: var(--card-shadow); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 15px; margin: 30px 0; }
        .plan-box { background: rgba(128,128,128,0.08); border: 2px solid var(--glass-border); padding: 22px 10px; border-radius: 25px; cursor: pointer; transition: 0.3s; text-align: center; color: var(--text-main); }
        .plan-box.selected { background: var(--accent-color); border-color: var(--accent-color); color: #000; transform: scale(1.05); }
        .plan-box.selected * { color: #000 !important; }
        .plan-box strong { font-size: 19px; display: block; margin-top: 5px; font-weight: 900; }

        /* وزنية البنك وزر النسخ الاحترافي */
        .bank-card { background: #000; border: 1px solid var(--glass-border); border-radius: 35px; padding: 45px 30px; max-width: 500px; margin: 40px auto 0; text-align: center; color: #fff; box-shadow: 0 30px 60px rgba(0,0,0,0.7); }
        body.light-mode .bank-card { background: #ffffff; color: #1a1c20; border: 1px solid #ff000033; }
        .bank-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(128,128,128,0.1); font-size: 16px; font-weight: 700; }
        
        .iban-btn-box { 
            width: 100%; background: rgba(255,0,0,0.04); border: 2.5px dashed #ff0000; 
            padding: 22px; border-radius: 22px; margin: 30px 0; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 15px; 
            transition: 0.4s; position: relative;
        }
        .iban-btn-box:hover { background: rgba(255,0,0,0.08); transform: scale(1.02); }
        .iban-text { font-family: 'Courier New', monospace; font-size: clamp(12px, 3.8vw, 17px); color: #ff0000; font-weight: 900; letter-spacing: 0.5px; }
        .copy-label { background: #ff0000; color: #fff; padding: 6px 12px; border-radius: 50px; font-size: 10px; font-weight: 900; display: flex; align-items: center; gap: 5px; }

        .confirm-btn { width: 100%; background: #ff0000; color: #fff !important; border: none; padding: 24px; border-radius: 22px; font-weight: 900; font-size: 20px; cursor: pointer; box-shadow: 0 15px 45px rgba(255,0,0,0.4); transition: 0.4s; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #fff; padding: 18px 50px; border-radius: 80px; display: none; z-index: 3000; font-weight: 900; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }

        @media (max-width: 650px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } .card { padding: 30px 10px; } .card h3 { font-size: 9px; } .logo { font-size: 40px; } }
    </style>
</head>
<body>
    <div class="aura"></div>
    <div class="toast" id="toast">تم نسخ الآيبان بنجاح ✅</div>

    <nav class="top-nav">
        <div class="nav-pill"><button class="btn-icon" onclick="openDrawer()"><i class="fas fa-bars"></i></button></div>
        <div class="nav-pill">
            <button class="btn-icon" onclick="toggleTheme()"><i id="theme-icon" class="fas fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <header>
            <div class="logo">NIKAI</div>
            <p class="sub-logo">متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان</p>
        </header>

        <div class="grid" id="mainGrid"></div>

        <section id="checkout">
            <h2 id="s-title" style="text-align: center; margin-bottom: 30px; font-size: 35px; font-weight: 900;"></h2>
            <div id="s-plans" class="plans-grid"></div>
            
            <div id="email-area" style="text-align:right; margin:40px 0; display:none;">
                <label style="font-size:15px; opacity:0.8; display:block; margin-bottom:12px; font-weight: 800;">البريد الإلكتروني للتفعيل:</label>
                <input type="email" id="u-email" style="width:100%; padding:22px; border-radius:22px; border:2px solid var(--glass-border); background:rgba(128,128,128,0.05); color:var(--text-main); font-family:'Cairo'; outline:none; font-size: 17px; font-weight: 700;" placeholder="mail@example.com">
            </div>

            <div class="bank-card">
                <div class="bank-row"><span>البنك:</span><strong>بنك البلاد</strong></div>
                <div class="bank-row"><span>المستفيد:</span><strong>سليمان فلاته</strong></div>
                <div class="iban-btn-box" onclick="copyIBAN()">
                    <span class="iban-text" id="ibanText">SA0315000900133520020007</span>
                    <span class="copy-label"><i class="fas fa-copy"></i> نسخ</span>
                </div>
                <button class="confirm-btn" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> تأكيد الطلب عبر واتساب
                </button>
            </div>
        </section>
    </div>

    <script>
        window.addEventListener('mousemove', e => {
            document.body.style.setProperty('--mx', (e.clientX / window.innerWidth) * 100 + '%');
            document.body.style.setProperty('--my', (e.clientY / window.innerHeight) * 100 + '%');
        });

        const products = {
            crunchy: { icon: 'fas fa-tv', name: {ar:"كرانشي رول", en:"Crunchyroll"}, plans: [{l:{ar:"سنة كاملة", en:"1 Year"}, p:"50 ريال"}] },
            fasel: { icon: 'fas fa-bolt', name: {ar:"فاصل بلس", en:"Fasel Plus"}, plans: [{l:{ar:"سنة كاملة", en:"1 Year"}, p:"89 ريال"}] },
            canva: { icon: 'fas fa-pen-nib', name: {ar:"كانفا برو", en:"Canva Pro"}, plans: [{l:{ar:"مدى الحياة", en:"Lifetime"}, p:"39 ريال"}] },
            osn: { icon: 'fas fa-plus-circle', name: {ar:"+OSN", en:"+OSN"}, plans: [{l:{ar:"شهر", en:"1 Mo"}, p:"15.99 ريال"}, {l:{ar:"3 أشهر", en:"3 Mo"}, p:"33.99 ريال"}, {l:{ar:"6 أشهر", en:"6 Mo"}, p:"60.99 ريال"}, {l:{ar:"سنة مشترك", en:"Year Shared"}, p:"110 ريال"}, {l:{ar:"سنة خاص", en:"Year Private"}, p:"239.99 ريال"}] },
            windows: { icon: 'fab fa-windows', name: {ar:"ويندوز", en:"Windows"}, plans: [{l:{ar:"10 Pro", en:"10 Pro"}, p:"24.99 ريال"}, {l:{ar:"11 Pro", en:"11 Pro"}, p:"28.99 ريال"}, {l:{ar:"11 Home", en:"11 Home"}, p:"28.99 ريال"}, {l:{ar:"10 Home", en:"10 Home"}, p:"33.99 ريال"}] },
            autodesk: { icon: 'fas fa-drafting-compass', name: {ar:"أوتوديسك", en:"Autodesk"}, plans: [{l:{ar:"6 أشهر", en:"6 Mo"}, p:"150 ريال"}, {l:{ar:"12 شهر", en:"12 Mo"}, p:"250 ريال"}], email: true },
            netflix: { icon: 'fas fa-film', name: {ar:"نتفليكس", en:"Netflix"}, plans: [{l:{ar:"شهر", en:"1 Mo"}, p:"20 ريال"}, {l:{ar:"سنة", en:"1 Year"}, p:"200 ريال"}] },
            shahid: { icon: 'fas fa-play-circle', name: {ar:"شاهد VIP", en:"Shahid VIP"}, plans: [{l:{ar:"سنة", en:"Year"}, p:"200 ريال"}] },
            youtube: { icon: 'fab fa-youtube', name: {ar:"يوتيوب بريميوم", en:"YouTube"}, plans: [{l:{ar:"سنة كاملة", en:"1 Year"}, p:"200 ريال"}], email: true },
            adobe: { icon: 'fas fa-palette', name: {ar:"أدوبي CC", en:"Adobe CC"}, plans: [{l:{ar:"سنة", en:"Year"}, p:"999 ريال"}], email: true },
            office: { icon: 'fas fa-file-word', name: {ar:"أوفيس 365", en:"Office 365"}, plans: [{l:{ar:"مدى الحياة", en:"Lifetime"}, p:"45 ريال"}] },
            linkedin: { icon: 'fab fa-linkedin', name: {ar:"لينكد إن", en:"LinkedIn"}, plans: [{l:{ar:"سنة", en:"Year"}, p:"600 ريال"}] },
            chatgpt: { icon: 'fas fa-robot', name: {ar:"ChatGPT Plus", en:"ChatGPT Plus"}, plans: [{l:{ar:"شهر", en:"1 Mo"}, p:"10 ريال"}] }
        };

        function renderGrid() {
            document.getElementById('mainGrid').innerHTML = Object.keys(products).map(id => `
                <div class="card" onclick="selectService('${id}')" id="card-${id}">
                    <i class="${products[id].icon}"></i>
                    <h3>${products[id].name.ar}</h3>
                </div>
            `).join('');
        }

        function toggleTheme() { 
            document.body.classList.toggle('light-mode'); 
            document.getElementById('theme-icon').className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon'; 
        }

        let selP = "", selL = "";
        function selectService(id) {
            document.body.className = (document.body.classList.contains('light-mode') ? 'light-mode ' : '') + 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + id).classList.add('active');
            const s = products[id];
            const pnl = document.getElementById('checkout');
            pnl.style.display = 'block';
            document.getElementById('s-title').innerText = s.name.ar;
            document.getElementById('s-plans').innerHTML = s.plans.map(p => `
                <div class="plan-box" onclick="setPlan(this, '${p.p}', '${p.l.ar}')">
                    <div>${p.l.ar}</div>
                    <strong>${p.p}</strong>
                </div>
            `).join('');
            document.getElementById('email-area').style.display = (s.email) ? 'block' : 'none';
            document.querySelector('.plan-box').click();
            window.scrollTo({ top: pnl.offsetTop - 50, behavior: 'smooth' });
        }

        function setPlan(el, p, l) {
            document.querySelectorAll('.plan-box').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected'); selP = p; selL = l;
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast'); t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function placeOrder() {
            const e = document.getElementById('u-email').value;
            let msg = `طلب جديد: ${document.getElementById('s-title').innerText} - الباقة: ${selL} - السعر: ${selP}`;
            if(e) msg += ` - البريد: ${e}`;
            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }

        renderGrid();
    </script>
</body>
</html>
