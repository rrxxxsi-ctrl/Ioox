<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | متجر متخصص اشتراكات الرقميه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --text-main: #ffffff;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg-base: #f0f2f5;
            --text-main: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        /* أنظمة الألوان الديناميكية */
        body.theme-autodesk { --accent-color: #00d2ff; --glow-color: rgba(0, 210, 255, 0.3); } 
        body.theme-windows { --accent-color: #00a884; --glow-color: rgba(0, 168, 132, 0.3); } 
        body.theme-osn { --accent-color: #ff007f; --glow-color: rgba(255, 0, 127, 0.3); }
        body.theme-adobe { --accent-color: #ff0054; --glow-color: rgba(255, 0, 84, 0.3); }
        body.theme-youtube { --accent-color: #ff0000; --glow-color: rgba(255, 0, 0, 0.3); }
        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.3); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            transition: var(--transition-smooth);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* خلفية متحركة نابضة بالحياة */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 0%), var(--glow-color) 0%, transparent 60%);
            z-index: -1; pointer-events: none; transition: background 0.8s ease;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; width: 100%; }

        /* Header Styles */
        header { padding: 40px 0; animation: fadeInDown 0.8s ease; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .control-btn { 
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 13px; font-weight: 700;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .control-btn:hover { background: var(--accent-color); color: #000; transform: translateY(-2px); }

        .logo { font-size: 48px; font-weight: 900; letter-spacing: 8px; color: var(--accent-color); transition: var(--transition-smooth); text-shadow: 0 0 20px var(--glow-color); }

        /* Grid & Cards Animation */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 15px; margin: 20px 0 40px; }
        .card {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 25px 10px; cursor: pointer; transition: var(--transition-smooth);
            backdrop-filter: blur(5px); position: relative;
        }
        .card:hover { transform: translateY(-10px) scale(1.05); border-color: var(--accent-color); box-shadow: 0 15px 35px var(--glow-color); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.08); transform: scale(1.05); }
        .card i { font-size: 32px; margin-bottom: 12px; color: var(--accent-color); transition: 0.5s; }

        /* Checkout Panel */
        #checkout {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 40px;
            padding: 40px 20px; margin-bottom: 60px; display: none; 
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(15px);
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .plan-btn {
            background: rgba(128,128,128,0.08); border: 1px solid var(--glass-border); padding: 18px;
            border-radius: 20px; cursor: pointer; transition: 0.3s; color: var(--text-main);
        }
        .plan-btn:hover { border-color: var(--accent-color); transform: scale(1.02); }
        .plan-btn.selected { background: var(--accent-color); color: #000; font-weight: 800; border-color: var(--accent-color); box-shadow: 0 10px 25px var(--glow-color); }

        /* الحساب البنكي المطور */
        .bank-section {
            background: #000; border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 35px; max-width: 500px; margin: 40px auto 0; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .iban-container {
            width: 100%; background: rgba(255,255,255,0.03); border: 2px dashed #ff0000; 
            padding: 18px; border-radius: 15px; margin: 25px 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: 0.3s; overflow: hidden;
        }
        .iban-container:hover { background: rgba(255,0,0,0.05); transform: scale(1.02); }
        .iban-text { font-family: 'Courier New', monospace; font-size: clamp(12px, 4vw, 17px); color: #ff0000; font-weight: 900; white-space: nowrap; }

        .btn-order { 
            width: 100%; background: #ff0000; color: #fff; border: none; padding: 22px; 
            border-radius: 18px; font-weight: 800; font-size: 19px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(255,0,0,0.3); transition: 0.4s;
            animation: pulseOrder 2s infinite;
        }
        @keyframes pulseOrder { 0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); } 70% { box-shadow: 0 0 0 15px rgba(255,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,0,0,0); } }

        footer { 
            padding: 40px 0; text-align: center; font-size: 13px; opacity: 0.6; 
            border-top: 1px solid var(--glass-border); margin-top: auto; 
        }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #000; padding: 15px 35px; border-radius: 50px; display: none; z-index: 2000; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="toast" id="toast">تم النسخ ✅</div>

    <div class="container" style="flex: 1;">
        <header>
            <div class="controls">
                <button class="control-btn" id="langToggle" onclick="toggleLang()">English</button>
                <button class="control-btn" onclick="toggleTheme()">الوضع النهاري</button>
            </div>
            <div class="logo">NIKAI</div>
            <p id="sub-title" style="opacity: 0.7; margin-top: 10px;">متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان</p>
        </header>

        <div class="grid" id="mainGrid"></div>

        <section id="checkout">
            <h2 id="s-title" style="font-size: 32px; font-weight: 900; margin-bottom: 15px;"></h2>
            <div class="plans-grid" id="s-plans"></div>
            
            <div id="email-area" style="margin: 25px 0; text-align: right; display: none;">
                <label id="email-label" style="font-size: 14px; opacity: 0.8; display: block; margin-bottom: 10px;">البريد الإلكتروني:</label>
                <input type="email" id="u-email" style="width:100%; padding:18px; border-radius:15px; border:1px solid var(--glass-border); background:rgba(128,128,128,0.05); color:var(--text-main); font-family:'Cairo';" placeholder="example@mail.com">
            </div>

            <div class="bank-section">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:15px;">
                    <span id="b-bank">البنك:</span><strong>بنك البلاد</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:15px;">
                    <span id="b-user">المستفيد:</span><strong>سليمان فلاته</strong>
                </div>
                <div class="iban-container" onclick="copyIBAN()">
                    <span class="iban-text">SA0315000900133520020007</span>
                    <i class="fas fa-copy" style="font-size: 14px; opacity: 0.6;"></i>
                </div>
                <button class="btn-order" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> <span id="b-confirm">تأكيد الطلب عبر واتساب</span>
                </button>
            </div>
        </section>
    </div>

    <footer>جميع الحقوق محفوظه للمتجر NIKAI</footer>

    <script>
        // إعداد الإضاءة التفاعلية مع الماوس
        document.addEventListener('mousemove', e => {
            document.body.style.setProperty('--mouse-x', (e.clientX / window.innerWidth) * 100 + '%');
            document.body.style.setProperty('--mouse-y', (e.clientY / window.innerHeight) * 100 + '%');
        });

        const services = {
            autodesk: { icon: 'fas fa-drafting-compass', name: {ar: "أوتوديسك", en: "Autodesk"}, plans: [{l:{ar:"12 شهر", en:"12 Months"}, p:"250 ريال"}], email: true },
            windows: { icon: 'fab fa-windows', name: {ar: "ويندوز", en: "Windows"}, plans: [{l:{ar:"10 Pro", en:"10 Pro"}, p:"24.99 ريال"}], email: false },
            osn: { icon: 'fas fa-plus-circle', name: {ar: "OSN+", en: "OSN+"}, plans: [{l:{ar:"سنة", en:"Year"}, p:"110 ريال"}], email: false },
            youtube: { icon: 'fab fa-youtube', name: {ar: "يوتيوب", en: "YouTube"}, plans: [{l:{ar:"سنة", en:"Year"}, p:"200 ريال"}], email: true },
            netflix: { icon: 'fas fa-film', name: {ar: "نتفليكس", en: "Netflix"}, plans: [{l:{ar:"شهر", en:"Month"}, p:"20 ريال"}], email: false }
        };

        const texts = {
            ar: { sub: "متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان", email: "البريد الإلكتروني:", bank: "البنك:", user: "المستفيد:", confirm: "تأكيد الطلب عبر واتساب", copy: "تم النسخ ✅" },
            en: { sub: "Digital Subscriptions Specialist - Order Now", email: "Email Address:", bank: "Bank:", user: "Beneficiary:", confirm: "Confirm via WhatsApp", copy: "Copied ✅" }
        };

        let currentLang = 'ar';

        function renderGrid() {
            document.getElementById('mainGrid').innerHTML = Object.keys(services).map(id => `
                <div class="card" onclick="selectService('${id}')" id="card-${id}">
                    <i class="${services[id].icon}"></i>
                    <h3>${services[id].name[currentLang]}</h3>
                </div>
            `).join('');
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            document.getElementById('sub-title').innerText = texts[currentLang].sub;
            renderGrid();
            document.getElementById('checkout').style.display = 'none';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isL = document.body.classList.contains('light-mode');
            event.target.innerText = isL ? "الوضع الليلي" : "الوضع النهاري";
        }

        function selectService(id) {
            document.body.className = (document.body.classList.contains('light-mode') ? 'light-mode ' : '') + 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + id).classList.add('active');
            
            const s = services[id];
            const pnl = document.getElementById('checkout');
            pnl.style.display = 'block';
            document.getElementById('s-title').innerText = s.name[currentLang];
            document.getElementById('s-plans').innerHTML = s.plans.map(p => `
                <div class="plan-btn selected">
                    <div>${p.l[currentLang]}</div>
                    <strong>${p.p}</strong>
                </div>
            `).join('');
            document.getElementById('email-area').style.display = s.email ? 'block' : 'none';
            window.scrollTo({ top: pnl.offsetTop - 30, behavior: 'smooth' });
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.innerText = texts[currentLang].copy; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function placeOrder() {
            const email = document.getElementById('u-email').value;
            let msg = `Hello NIKAI 👋\nOrder: ${document.getElementById('s-title').innerText}`;
            if(email) msg += `\nEmail: ${email}`;
            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }

        renderGrid();
    </script>
</body>
</html>
