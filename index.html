<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKAI | متجر متخصص اشتراكات الرقميه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05050a;
            --text-main: #ffffff;
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg-base: #f8f9fa;
            --text-main: #1a1a1a;
            --glass: rgba(0, 0, 0, 0.03);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        /* تنسيق الهوية اللونية للمنتجات */
        body.theme-autodesk { --accent-color: #00d2ff; --glow-color: rgba(0, 210, 255, 0.2); } 
        body.theme-windows { --accent-color: #00a884; --glow-color: rgba(0, 168, 132, 0.2); } 
        body.theme-adobe { --accent-color: #ff0054; --glow-color: rgba(255, 0, 84, 0.2); }
        body.theme-youtube { --accent-color: #ff0000; --glow-color: rgba(255, 0, 0, 0.2); }
        body.theme-netflix { --accent-color: #e50914; --glow-color: rgba(229, 9, 20, 0.2); }
        body.theme-shahid { --accent-color: #00d982; --glow-color: rgba(0, 217, 130, 0.2); }
        body.theme-chatgpt { --accent-color: #74aa9c; --glow-color: rgba(116, 170, 156, 0.2); }
        body.theme-crunchy { --accent-color: #ff6400; --glow-color: rgba(255, 100, 0, 0.2); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, var(--glow-color) 0%, transparent 70%);
            z-index: -1; transition: var(--transition);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; width: 100%; flex: 1; }

        /* الأزرار العلوية */
        header { padding: 30px 0 20px; text-align: center; }
        .top-controls { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .ctrl-btn { 
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
        }

        .logo { font-size: 45px; font-weight: 900; letter-spacing: 5px; color: #fff; margin-bottom: 5px; }
        .sub-logo { opacity: 0.7; font-size: 16px; margin-bottom: 40px; }

        /* الشبكة المرنة المصلحة */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 كروت في الصف مثل الصورة */
            gap: 15px; 
            margin-bottom: 50px; 
        }

        .card {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 25px;
            padding: 30px 15px; cursor: pointer; transition: var(--transition);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--accent-color); }
        .card.active { border-color: var(--accent-color); background: rgba(255,255,255,0.08); }
        .card i { font-size: 32px; margin-bottom: 12px; }
        .card h3 { font-size: 13px; font-weight: 700; text-align: center; }

        /* لوحة الدفع */
        #checkout {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 35px;
            padding: 35px 20px; margin-bottom: 60px; display: none; animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 25px 0; }
        .plan-btn {
            background: rgba(128,128,128,0.05); border: 1px solid var(--glass-border); padding: 15px;
            border-radius: 15px; cursor: pointer; color: var(--text-main); transition: 0.3s;
        }
        .plan-btn.selected { background: var(--accent-color); color: #000; font-weight: 800; border-color: var(--accent-color); }

        /* وزنية الحساب البنكي المصلحة */
        .bank-box {
            background: #000; border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 30px; max-width: 480px; margin: 30px auto 0; text-align: center; color: #fff;
        }
        .bank-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .iban-container {
            width: 100%; background: rgba(255,255,255,0.02); border: 2px dashed #ff0000; /* الإطار الأحمر المتقطع */
            padding: 18px; border-radius: 12px; margin: 20px 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden; 
        }
        .iban-text { font-family: 'Courier New', monospace; font-size: clamp(11px, 3.8vw, 16px); color: #ff0000; font-weight: 900; white-space: nowrap; }

        .btn-whatsapp { 
            width: 100%; background: #ff0000; color: #fff; border: none; padding: 20px; 
            border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }

        /* الحقوق */
        footer { padding: 40px 0; text-align: center; font-size: 13px; opacity: 0.6; margin-top: auto; border-top: 1px solid var(--glass-border); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 30px; border-radius: 50px; display: none; z-index: 2000; font-weight: 800; }

        @media (max-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } .card i { font-size: 24px; } .card h3 { font-size: 9px; } }
    </style>
</head>
<body class="theme-default">
    <div class="ambient-bg"></div>
    <div class="toast" id="toast"></div>

    <div class="container">
        <header>
            <div class="top-controls">
                <button class="ctrl-btn" id="langBtn" onclick="toggleLang()">English</button>
                <button class="ctrl-btn" id="themeBtn" onclick="toggleTheme()">الوضع النهاري</button>
            </div>
            <div class="logo">NIKAI</div>
            <p id="sub-title" class="sub-logo">متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان</p>
        </header>

        <div class="grid" id="mainGrid"></div>

        <section id="checkout">
            <h2 id="s-title" style="font-size: 30px; font-weight: 900; margin-bottom: 20px;"></h2>
            <div class="plans-grid" id="s-plans"></div>

            <div id="input-fields" style="text-align: right; margin: 25px 0;">
                <label id="l-email" style="font-size: 13px; opacity: 0.7; display: block; margin-bottom: 8px;"></label>
                <input type="email" id="u-email" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--glass-border); background:rgba(128,128,128,0.05); color:var(--text-main);" placeholder="mail@example.com">
                <div id="pass-area" style="display:none; margin-top: 15px;">
                    <label id="l-pass" style="font-size: 13px; opacity: 0.7; display: block; margin-bottom: 8px;"></label>
                    <input type="text" id="u-pass" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--glass-border); background:rgba(128,128,128,0.05); color:var(--text-main);" placeholder="Password">
                </div>
            </div>

            <div class="bank-box">
                <div class="bank-row"><span id="l-bank">البنك:</span><strong>بنك البلاد</strong></div>
                <div class="bank-row"><span id="l-user">المستفيد:</span><strong>سليمان فلاته</strong></div>
                <div class="iban-container" onclick="copyIBAN()">
                    <span class="iban-text">SA0315000900133520020007</span>
                    <i class="fas fa-copy" style="font-size: 12px; opacity: 0.5;"></i>
                </div>
                <button class="btn-whatsapp" onclick="placeOrder()">
                    <i class="fab fa-whatsapp"></i> <span id="l-confirm">تأكيد الطلب عبر واتساب</span>
                </button>
            </div>
        </section>
    </div>

    <footer id="l-footer">جميع الحقوق محفوظه للمتجر NIKAI</footer>

    <script>
        let lang = 'ar';
        const data = {
            autodesk: { icon: 'fas fa-drafting-compass', name: {ar:"أوتوديسك", en:"Autodesk"}, plans: [{l:{ar:"6 أشهر", en:"6 Months"}, p:"150 ريال"}, {l:{ar:"12 شهر", en:"12 Months"}, p:"250 ريال"}], email: true },
            windows: { icon: 'fab fa-windows', name: {ar:"ويندوز", en:"Windows"}, plans: [{l:{ar:"10 Pro", en:"10 Pro"}, p:"24.99 ريال"}, {l:{ar:"11 Pro", en:"11 Pro"}, p:"28.99 ريال"}], email: false },
            osn: { icon: 'fas fa-plus-circle', name: {ar:"+OSN", en:"+OSN"}, plans: [{l:{ar:"سنة", en:"12 Months"}, p:"110 ريال"}], email: false },
            youtube: { icon: 'fab fa-youtube', name: {ar:"يوتيوب بريميوم", en:"YouTube"}, plans: [{l:{ar:"دعوة (سنة)", en:"Invite"}, p:"200 ريال"}, {l:{ar:"فردي (سنة)", en:"Indiv"}, p:"350 ريال", t:"ind"}], email: true },
            netflix: { icon: 'fas fa-film', name: {ar:"نتفليكس", en:"Netflix"}, plans: [{l:{ar:"شهر", en:"1 mo"}, p:"20 ريال"}, {l:{ar:"سنة", en:"1 yr"}, p:"200 ريال"}], email: false },
            shahid: { icon: 'fas fa-play-circle', name: {ar:"شاهد VIP", en:"Shahid VIP"}, plans: [{l:{ar:"سنة", en:"1 yr"}, p:"200 ريال"}], email: false },
            office: { icon: 'fas fa-file-word', name: {ar:"أوفيس 365", en:"Office 365"}, plans: [{l:{ar:"مدى الحياة", en:"Lifetime"}, p:"45 ريال"}], email: false },
            crunchy: { icon: 'fas fa-tv', name: {ar:"كرانشي رول", en:"Crunchyroll"}, plans: [{l:{ar:"سنة", en:"1 yr"}, p:"50 ريال"}], email: false },
            chatgpt: { icon: 'fas fa-robot', name: {ar:"ChatGPT Plus", en:"ChatGPT Plus"}, plans: [{l:{ar:"شهر", en:"1 mo"}, p:"10 ريال"}, {l:{ar:"سنة", en:"1 yr"}, p:"100 ريال"}], email: false },
            adobe: { icon: 'fas fa-palette', name: {ar:"أدوبي", en:"Adobe"}, plans: [{l:{ar:"سنة", en:"1 yr"}, p:"999 ريال"}], email: true },
            linkedin: { icon: 'fab fa-linkedin', name: {ar:"لينكد إن", en:"LinkedIn"}, plans: [{l:{ar:"سنة", en:"1 yr"}, p:"600 ريال"}], email: true },
            fasel: { icon: 'fas fa-bolt', name: {ar:"فاصل بلس", en:"Fasel Plus"}, plans: [{l:{ar:"سنة", en:"1 yr"}, p:"89 ريال"}], email: false }
        };

        const ui = {
            ar: { sub: "متجر متخصص اشتراكات الرقميه اطلب اشتراكك الان", email: "البريد الإلكتروني للتفعيل:", pass: "كلمة المرور:", bank: "البنك:", user: "المستفيد:", confirm: "تأكيد الطلب عبر واتساب", footer: "جميع الحقوق محفوظه للمتجر NIKAI", copied: "تم النسخ ✅" },
            en: { sub: "Digital Subscriptions Specialist - Order Now", email: "Email for Activation:", pass: "Account Password:", bank: "Bank:", user: "Beneficiary:", confirm: "Confirm via WhatsApp", footer: "All Rights Reserved - NIKAI Store", copied: "Copied ✅" }
        };

        function renderGrid() {
            document.getElementById('mainGrid').innerHTML = Object.keys(data).map(id => `
                <div class="card" onclick="selectService('${id}')" id="card-${id}">
                    <i class="${data[id].icon}"></i>
                    <h3>${data[id].name[lang]}</h3>
                </div>
            `).join('');
        }

        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = lang === 'ar' ? 'English' : 'العربية';
            document.getElementById('sub-title').innerText = ui[lang].sub;
            document.getElementById('l-footer').innerText = ui[lang].footer;
            renderGrid();
            document.getElementById('checkout').style.display = 'none';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.getElementById('themeBtn').innerText = document.body.classList.contains('light-mode') ? "الوضع الليلي" : "الوضع النهاري";
        }

        let selP = "", selL = "", selT = "";
        function selectService(id) {
            document.body.className = (document.body.classList.contains('light-mode') ? 'light-mode ' : '') + 'theme-' + id;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById('card-' + id).classList.add('active');
            
            const s = data[id];
            document.getElementById('checkout').style.display = 'block';
            document.getElementById('s-title').innerText = s.name[lang];
            document.getElementById('s-plans').innerHTML = s.plans.map(p => `
                <div class="plan-btn" onclick="setPlan(this, '${p.p}', '${p.l[lang]}', '${p.t || ''}')">
                    <div>${p.l[lang]}</div>
                    <strong>${p.p}</strong>
                </div>
            `).join('');
            
            document.getElementById('l-email').innerText = ui[lang].email;
            document.getElementById('l-pass').innerText = ui[lang].pass;
            document.getElementById('l-bank').innerText = ui[lang].bank;
            document.getElementById('l-user').innerText = ui[lang].user;
            document.getElementById('l-confirm').innerText = ui[lang].confirm;
            document.getElementById('input-fields').style.display = s.email ? 'block' : 'none';

            document.querySelector('.plan-btn').click();
            window.scrollTo({ top: document.getElementById('checkout').offsetTop - 30, behavior: 'smooth' });
        }

        function setPlan(el, p, l, t) {
            document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected'); selP = p; selL = l; selT = t;
            document.getElementById('pass-area').style.display = (t === 'ind') ? 'block' : 'none';
        }

        function copyIBAN() {
            navigator.clipboard.writeText("SA0315000900133520020007");
            const t = document.getElementById('toast');
            t.innerText = ui[lang].copied; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function placeOrder() {
            const email = document.getElementById('u-email').value;
            const pass = document.getElementById('u-pass').value;
            let msg = `Order: ${document.getElementById('s-title').innerText}\nPlan: ${selL}\nPrice: ${selP}`;
            if(email) msg += `\nEmail: ${email}`;
            if(selT === 'ind' && pass) msg += `\nPass: ${pass}`;
            window.open(`https://wa.me/966591388202?text=${encodeURIComponent(msg)}`, '_blank');
        }

        renderGrid();
    </script>
</body>
</html>
